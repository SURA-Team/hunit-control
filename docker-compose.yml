# HUNIT Control — servidor (API + automação do Hunit), banco de dados, proxy HTTPS e cópia de
# segurança.
#
# Toda a configuração vem de variáveis de ambiente (constitution, princípio V):
# copie .env.example para .env, preencha as variáveis obrigatórias e rode
#   docker compose up -d --build
#
# Da rede, a API só é acessível em HTTPS, pelo proxy. A porta HTTP do servidor fica presa a
# 127.0.0.1: só o próprio PC a alcança (FR-032, SC-013).
name: hunit-control

services:
  server:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    restart: unless-stopped
    init: true # encerra corretamente os processos-filho do Chromium
    shm_size: 1gb # o Chromium precisa de mais memória compartilhada que o padrão do Docker (64 MB)
    depends_on:
      db:
        condition: service_healthy
    environment:
      PORT: 3000
      DATABASE_URL: postgres://hunit:${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no arquivo .env}@db:5432/hunit
      ACCOUNT_KEY_SECRET: ${ACCOUNT_KEY_SECRET:?defina ACCOUNT_KEY_SECRET no arquivo .env}
      HUNIT_WEB_URL: ${HUNIT_WEB_URL:-https://hunit.hsystem.com.br}
      HUNIT_API_URL: ${HUNIT_API_URL:-https://hunit-api.hsystem.com.br}
      TWO_FACTOR_TIMEOUT_SECONDS: ${TWO_FACTOR_TIMEOUT_SECONDS:-120}
      HOTEL_CONCURRENCY: ${HOTEL_CONCURRENCY:-1}
      MAX_PERIOD_DAYS: ${MAX_PERIOD_DAYS:-}
      EVIDENCE_DIR: /data/evidence
      EVIDENCE_RETENTION_DAYS: ${EVIDENCE_RETENTION_DAYS:-30}
      RESERVATION_RETENTION_YEARS: ${RESERVATION_RETENTION_YEARS:-5}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    ports:
      - '127.0.0.1:${PORT:-3000}:3000'
    volumes:
      - evidence:/data/evidence

  proxy:
    image: caddy:2.11.9-alpine
    restart: unless-stopped
    depends_on:
      - server
    environment:
      SERVER_HOSTNAME: ${SERVER_HOSTNAME:?defina SERVER_HOSTNAME no arquivo .env (nome ou IP do PC na rede)}
    ports:
      - '${HTTPS_PORT:-443}:443'
    volumes:
      - ./deploy/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data

  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: hunit
      POSTGRES_DB: hunit
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no arquivo .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U hunit -d hunit']
      interval: 5s
      timeout: 5s
      retries: 10

  backup:
    # Mesma imagem do banco: traz pg_dump, pg_restore e gpg na versão do servidor (research R-21).
    image: postgres:17
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    entrypoint: ['bash', '/scripts/backup.sh']
    environment:
      PGHOST: db
      PGUSER: hunit
      PGDATABASE: hunit
      PGPASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no arquivo .env}
      BACKUP_PASSPHRASE: ${BACKUP_PASSPHRASE:?defina BACKUP_PASSPHRASE no arquivo .env}
      BACKUP_INTERVAL_HOURS: ${BACKUP_INTERVAL_HOURS:-24}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-30}
    volumes:
      - ./deploy/backup:/scripts:ro
      - ${BACKUP_DIR:?defina BACKUP_DIR no arquivo .env (pasta das cópias, fora do PC ou sincronizada)}:/backups

volumes:
  pgdata: # dados do PostgreSQL (fonte da verdade)
  evidence: # capturas de tela, HTML e respostas guardados como evidência de falhas
  caddy-data: # autoridade certificadora interna do Caddy e certificados (não apague: os clientes confiam nela)
