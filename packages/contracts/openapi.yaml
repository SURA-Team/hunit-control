openapi: 3.1.0
info:
  title: HUNIT Control API
  version: 1.12.0
  license:
    name: Uso interno — proprietário
    identifier: LicenseRef-Proprietary
  description: |
    API de consulta de reservas de cartão virtual no Hunit (feature 001). A feature 002 (app
    desktop) acrescenta, sem quebrar os clientes existentes: `/me`, quem iniciou e o filtro de
    ativas na lista de execuções, os avisos no estado da execução, a busca livre, o canal e o
    valor nas reservas, a lista de canais e a lista de evidências de uma execução.
    A feature 003 (tratativas manuais) acrescenta, também sem quebrar os clientes existentes: o
    envio de documentos, o registro da tratativa e do comprovante por reserva (uma ou várias de
    uma vez), desfazer e reverter, o valor cobrado informado à mão, o resumo da tratativa em cada
    reserva e os filtros `treatmentStatus` e `pendingCharge`; a situação da reserva (`situation`),
    o alerta "Verificar" (`needsReview`) e a confirmação dele. Nada disso acessa o Hunit.
    A feature 004 (importação do histórico do sistema anterior) acrescenta, sem quebrar os
    clientes existentes: a origem "Sistema anterior" das reservas (`Reservation.legacy`), o
    filtro `fromLegacy` e a marcação `fromLegacy` nos documentos e no histórico das tratativas.
    A importação em si é um comando administrativo do servidor, sem rota na API.
    A feature 005 (envio dos pedidos de cobrança ao Comercial pela planilha) acrescenta, sem
    quebrar os clientes existentes: os envios ao Comercial (`/commercial-dispatches`, com token,
    acompanhamento, cancelamento e retomada, como as execuções), a linha da reserva na planilha e o
    retorno do Comercial (`/reservations/{hotelCode}/{reservationNumber}/commercial`,
    `/commercial-returns`), o estado da planilha (`/commercial-sheet`), a confirmação do alerta
    "Verificar" em lote (`/treatment-reviews`), a seleção de todas as reservas de um filtro
    (`/reservations/selection`), a situação detalhada com "Validar comprovante"
    (`detailedSituation`, que não muda os valores de `situation`) e a origem do valor cobrado.
    O envio só lê o Hunit; os demais acréscimos não acessam o Hunit.
    A feature 006 (redesenho do app desktop) acrescenta, sem quebrar os clientes existentes: os
    filtros rápidos da lista (`quickFilter`), a ordem por hotel e check-in (`order`) e a contagem
    das reservas de cada filtro rápido (`/reservations/quick-filter-counts`). Sem os parâmetros
    novos, as rotas respondem como na 1.7.0. Nada disso acessa o Hunit.
    A feature 008 (ajustes de cobrança) acrescenta, sem quebrar os clientes existentes: a situação
    e a data da cobrança no retorno do Comercial (`chargeSituation`, `chargeDate`), os relatos
    "Cobrada no Hunit" e "Cancelada", que o Financeiro valida (`report`, `reports`,
    `/commercial/cancellation`), a fila "Cobradas no Hunit"
    (`/commercial-hunit-charges`) com a verificação no Hunit (um envio com `purpose` =
    `hunit_check`, só leitura), a marcação "Cancelada sem cobrança" do Financeiro (`/no-charge`,
    `noCharge`, `amountToCharge`) e a busca pelo código de autorização do retorno confirmado. As
    enumerações que o app 0.3 usa como chave não ganham valores; a lista de envios só traz as
    verificações com `purpose`.
    A feature 007 (relatórios) acrescenta, sem quebrar os clientes existentes: o resumo do período
    de check-in, com os totais e uma linha por hotel (`/reports/overview`), e a ordem `amount_desc`
    das reservas (valor do maior para o menor). Só leitura; nada disso acessa o Hunit. A 1.11.0
    acrescenta ao resumo os filtros opcionais da lista (`hotelCode`, `detailedSituation`,
    `reservationStatus`, `channel`, `fromLegacy` e `notFound`); sem eles, responde como na 1.10.0.
    A feature 009 (validação dos retornos do Comercial) acrescenta, sem quebrar os clientes
    existentes: o retorno com uma situação livre do Comercial (`situationReturn`,
    `situationReturns`), que o Financeiro confirma como cobrado ou como cancelado sem cobrança
    (`/commercial-returns/{returnId}/situation/confirm`) ou recusa, e a aba "Aguardando validação
    do Financeiro" da planilha (`sheetTab`). Os campos e as rotas da 1.11.0 não mostram nem
    confirmam esse retorno (`currentReturn` nulo, 409 no `/confirm` e fora do lote). Nada disso
    acessa o Hunit.
    Credenciais e token 2FA do Hunit são aceitos apenas nos corpos de requisição indicados,
    usados em memória e nunca armazenados nem devolvidos.
    Datas em ISO 8601 (YYYY-MM-DD); valores monetários como string decimal em BRL.
    Erros são devolvidos como `application/problem+json` (RFC 9457) com um `code` estável.
    Qualquer operação pode responder 500 com `code = internal_error` em caso de falha inesperada.
servers:
  - url: /v1
security:
  - apiKey: []

tags:
  - name: executions
    description: Execuções da consulta no Hunit — início, token 2FA, acompanhamento, cancelamento e retomada
  - name: reservations
    description: Reservas consultadas, com a classificação e o histórico de verificações
  - name: hotels
    description: Catálogo de hotéis lido do Hunit
  - name: evidence
    description: Arquivos de evidência das falhas (captura, HTML e resposta), guardados por tempo limitado
  - name: health
    description: Disponibilidade do serviço
  - name: clients
    description: O cliente da API dono da chave usada (feature 002)
  - name: treatments
    description: Tratativas manuais das reservas — documentos, valor informado à mão e histórico (feature 003)
  - name: commercial
    description: Envio dos pedidos de cobrança ao Comercial pela planilha e retorno validado pelo Financeiro (feature 005)
  - name: reports
    description: Relatórios do período — valor em aberto, valor já cobrado e hotéis (feature 007)

paths:
  /health:
    get:
      tags: [health]
      operationId: getHealth
      summary: Verifica se o serviço e o banco estão disponíveis
      security: []
      responses:
        '200':
          description: Serviço disponível
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status: { type: string, enum: [ok] }
        '503':
          description: Serviço indisponível (o banco de dados não respondeu)
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /me:
    get:
      tags: [clients]
      operationId: getCurrentClient
      summary: Nome e perfil do cliente dono da chave usada (feature 002)
      responses:
        '200':
          description: Cliente autenticado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ClientIdentity' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /hotels:
    get:
      tags: [hotels]
      operationId: listHotels
      summary: Último catálogo de hotéis conhecido (FR-008)
      responses:
        '200':
          description: Catálogo
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Hotel' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /executions:
    post:
      tags: [executions]
      operationId: createExecution
      summary: Inicia uma execução (FR-001) — somente operador
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StartExecutionRequest' }
      responses:
        '202':
          description: Execução criada; acompanhe pelo GET ou pelos eventos
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Execution' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: Já existe execução ativa para esta conta do Hunit (FR-006)
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
    get:
      tags: [executions]
      operationId: listExecutions
      summary: Lista execuções (mais recentes primeiro)
      parameters:
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/ExecutionStatus' }
        - name: active
          in: query
          description: |
            true = só execuções ativas (queued, running, awaiting_2fa); false = só encerradas;
            omitido = todas. Combinável com `status` (feature 002).
          schema: { type: boolean }
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Página de execuções
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/ExecutionSummary' }
                  nextCursor: { type: [string, 'null'] }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /executions/{executionId}:
    parameters:
      - $ref: '#/components/parameters/ExecutionId'
    get:
      tags: [executions]
      operationId: getExecution
      summary: Estado completo e andamento da execução (FR-021)
      responses:
        '200':
          description: Execução
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Execution' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /executions/{executionId}/events:
    parameters:
      - $ref: '#/components/parameters/ExecutionId'
    get:
      tags: [executions]
      operationId: streamExecutionEvents
      summary: Stream de eventos em tempo real (Server-Sent Events)
      description: |
        Cada mensagem SSE tem `id` (sequencial), `event` (tipo) e `data` (JSON de ExecutionEvent).
        Reconexão com o cabeçalho `Last-Event-ID` reenvia os eventos posteriores.
        O evento `status_changed` com `status = awaiting_2fa` é enviado em até 5 s (SC-005).
        O stream termina depois do evento `status_changed` com estado final (`completed`,
        `failed` ou `cancelled`); para uma execução já encerrada, envia os eventos posteriores ao
        `Last-Event-ID` (se houver) e termina.
      parameters:
        - name: Last-Event-ID
          in: header
          schema: { type: string }
      responses:
        '200':
          description: Stream aberto
          content:
            text/event-stream:
              schema: { $ref: '#/components/schemas/ExecutionEvent' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /executions/{executionId}/evidence:
    parameters:
      - $ref: '#/components/parameters/ExecutionId'
    get:
      tags: [evidence]
      operationId: listExecutionEvidence
      summary: Evidências de falha registradas na execução (feature 002)
      description: |
        Evidências vencidas já foram removidas pela rotina diária e não aparecem; o download de
        uma que venceu entre a lista e o pedido responde `evidence_expired`.
      responses:
        '200':
          description: Evidências, mais recentes primeiro
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/EvidenceSummary' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /executions/{executionId}/two-factor:
    parameters:
      - $ref: '#/components/parameters/ExecutionId'
    post:
      tags: [executions]
      operationId: sendTwoFactor
      summary: Envia o token 2FA (FR-002) — somente operador
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              additionalProperties: false
              properties:
                token:
                  type: string
                  pattern: '^[0-9]{4,10}$'
                  writeOnly: true
      responses:
        '202':
          description: Token entregue à execução; o resultado chega pelo estado/eventos
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Execução não está aguardando token (expirada, cancelada ou já autenticada)
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /executions/{executionId}/cancel:
    parameters:
      - $ref: '#/components/parameters/ExecutionId'
    post:
      tags: [executions]
      operationId: cancelExecution
      summary: Cancela a execução (FR-022) — somente operador
      responses:
        '202':
          description: |
            Cancelamento solicitado; a execução para em até 15 s (SC-008) e termina `cancelled` —
            ou `completed`, se todos os hotéis já tinham terminado quando a parada foi notada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Execution' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Execução já encerrada
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /executions/{executionId}/resume:
    parameters:
      - $ref: '#/components/parameters/ExecutionId'
    post:
      tags: [executions]
      operationId: resumeExecution
      summary: Retoma uma execução interrompida a partir do primeiro hotel não concluído (FR-023)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [credentials]
              additionalProperties: false
              properties:
                credentials: { $ref: '#/components/schemas/HunitCredentials' }
      responses:
        '202':
          description: Nova execução criada (parentExecutionId = execução original)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Execution' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: |
            Execução não pode ser retomada: ainda ativa ou já há execução ativa na conta
            (`execution_already_active`), sem hotéis pendentes (`nothing_to_resume`) ou já
            retomada antes (`execution_already_resumed`; retome a última execução da sequência,
            citada em `detail`)
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /reservations:
    get:
      tags: [reservations]
      operationId: listReservations
      summary: Consulta reservas com filtros combináveis (FR-020)
      parameters:
        - name: executionId
          in: query
          description: Somente reservas observadas nesta execução
          schema: { type: string, format: uuid }
        - name: hotelCode
          in: query
          schema: { type: array, items: { type: string } }
          style: form
          explode: true
        - name: classification
          in: query
          schema: { type: array, items: { $ref: '#/components/schemas/Classification' } }
          style: form
          explode: true
        - name: reservationStatus
          in: query
          schema: { type: array, items: { $ref: '#/components/schemas/ReservationStatus' } }
          style: form
          explode: true
        - name: notFound
          in: query
          description: true = somente marcadas como "não encontrada na última verificação"
          schema: { type: boolean }
        - name: checkInFrom
          in: query
          schema: { type: string, format: date }
        - name: checkInTo
          in: query
          schema: { type: string, format: date }
        - name: q
          in: query
          description: |
            Busca livre (feature 002). Encontra a reserva se o número da reserva, a transação, o
            código de autorização ou a referência da operadora forem iguais ao texto (sem
            diferenciar maiúsculas), ou se o nome do hóspede contiver o texto (sem diferenciar
            maiúsculas e acentos). Espaços nas pontas são ignorados. Reservas anonimizadas não são
            encontradas pelo nome. Desde a 1.9.0 (feature 008), também acha pelo código de
            autorização de um retorno do Comercial confirmado pelo Financeiro (texto inteiro, sem
            diferenciar maiúsculas); retornos não confirmados ficam de fora.
          schema: { type: string, minLength: 2, maxLength: 100 }
        - name: channel
          in: query
          description: Canal exatamente como em Reservation.channel (ver GET /channels)
          schema: { type: string, minLength: 1, maxLength: 100 }
        - name: amount
          in: query
          description: >-
            Valor em BRL; encontra reservas cujo valor total, valor cobrado ou valor cobrado
            informado à mão (feature 003) seja igual
          schema: { type: string, pattern: '^[0-9]+\.[0-9]{2}$' }
        - name: treatmentStatus
          in: query
          description: >-
            Situação da tratativa (feature 003, FR-002): none = sem tratativa; sent = Enviada;
            charged = Cobrada. Combinável com os demais filtros.
          schema: { type: array, items: { $ref: '#/components/schemas/TreatmentStatus' } }
          style: form
          explode: true
        - name: pendingCharge
          in: query
          description: |
            true = "Falta cobrar" (feature 003, FR-002): classificação que exige cobrança e sem
            comprovante (treatmentStatus none ou sent). false = o contrário. Omitido = sem esse
            filtro. Combinável com os demais.
          schema: { type: boolean }
        - name: situation
          in: query
          description: >-
            Situação da reserva (feature 003, FR-002): qualquer uma das informadas, exatamente como
            em ReservationTreatment.situation. Combinável com os demais filtros.
          schema: { type: array, items: { $ref: '#/components/schemas/ReservationSituation' } }
          style: form
          explode: true
        - name: needsReview
          in: query
          description: >-
            true = só as reservas com o alerta "Verificar" (feature 003, FR-002a); false = o
            contrário. Omitido = sem esse filtro.
          schema: { type: boolean }
        - name: fromLegacy
          in: query
          description: >-
            true = só as reservas importadas do sistema anterior, com ou sem verificação posterior
            pelo HUNIT Control (feature 004, FR-011); false = só as que não vieram de lá. Omitido =
            sem esse filtro. Combinável com os demais.
          schema: { type: boolean }
        - name: detailedSituation
          in: query
          description: >-
            Situação detalhada da reserva (feature 005): qualquer uma das informadas, exatamente
            como em ReservationTreatment.detailedSituation — os valores de `situation` mais
            return_pending ("Validar comprovante"). Combinável com os demais filtros.
          schema: { type: array, items: { $ref: '#/components/schemas/ReservationDetailedSituation' } }
          style: form
          explode: true
        - $ref: '#/components/parameters/QuickFilter'
        - $ref: '#/components/parameters/ReservationOrder'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Página de reservas
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Reservation' }
                  nextCursor: { type: [string, 'null'] }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /reservations/{hotelCode}/{reservationNumber}:
    parameters:
      - name: hotelCode
        in: path
        required: true
        schema: { type: string }
      - name: reservationNumber
        in: path
        required: true
        schema: { type: string }
    get:
      tags: [reservations]
      operationId: getReservation
      summary: Detalhe de uma reserva
      responses:
        '200':
          description: Reserva
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Reservation' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /reservations/{hotelCode}/{reservationNumber}/treatment:
    parameters:
      - name: hotelCode
        in: path
        required: true
        schema: { type: string }
      - name: reservationNumber
        in: path
        required: true
        schema: { type: string }
    get:
      tags: [treatments]
      operationId: getReservationTreatment
      summary: Tratativa de uma reserva — documentos (atuais e anteriores) e histórico (feature 003)
      responses:
        '200':
          description: Tratativa da reserva
          content:
            application/json:
              schema:
                type: object
                required: [treatment, documents, events]
                properties:
                  treatment: { $ref: '#/components/schemas/ReservationTreatment' }
                  documents:
                    type: array
                    description: Todos os documentos da reserva, do mais recente para o mais antigo
                    items: { $ref: '#/components/schemas/TreatmentDocument' }
                  events:
                    type: array
                    description: Histórico completo, do mais recente para o mais antigo
                    items: { $ref: '#/components/schemas/TreatmentEvent' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /reservations/{hotelCode}/{reservationNumber}/treatment/review:
    parameters:
      - name: hotelCode
        in: path
        required: true
        schema: { type: string }
      - name: reservationNumber
        in: path
        required: true
        schema: { type: string }
    post:
      tags: [treatments]
      operationId: confirmTreatmentReview
      summary: Confirma o alerta "Verificar" de uma reserva (feature 003, FR-002a)
      description: |
        O operador conferiu a reserva que, depois da tratativa, o Hunit passou a mostrar numa
        situação que não exige cobrança. Só tira o alerta e registra a confirmação no histórico,
        com o status do Hunit confirmado; a tratativa continua registrada. Sem alerta, responde 200
        sem gravar nada. Não acessa o Hunit.
      responses:
        '200':
          description: Tratativa atualizada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReservationTreatment' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /reservations/{hotelCode}/{reservationNumber}/manual-amount:
    parameters:
      - name: hotelCode
        in: path
        required: true
        schema: { type: string }
      - name: reservationNumber
        in: path
        required: true
        schema: { type: string }
    put:
      tags: [treatments]
      operationId: setManualChargedAmount
      summary: Informa à mão o valor cobrado de uma reserva com comprovante (feature 003, FR-005)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [amount]
              additionalProperties: false
              properties:
                amount:
                  type: string
                  pattern: '^[0-9]+\.[0-9]{2}$'
                  description: Valor em BRL, maior que zero
      responses:
        '200':
          description: Tratativa atualizada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReservationTreatment' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
    delete:
      tags: [treatments]
      operationId: clearManualChargedAmount
      summary: Remove o valor informado à mão; volta a valer o do Hunit (feature 003, FR-005)
      responses:
        '200':
          description: Tratativa atualizada (sem mudança, se não havia valor)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReservationTreatment' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /treatment-files:
    post:
      tags: [treatments]
      operationId: uploadTreatmentFile
      summary: Envia o arquivo de uma tratativa ou de um comprovante (feature 003, FR-008)
      description: |
        Corpo: o arquivo puro, com até 26 214 400 bytes (25 MiB). Tipos aceitos: e-mail (.eml,
        .msg), PDF e imagem (.png, .jpg, .jpeg); o servidor confere o conteúdo contra a extensão.
        Enviar de novo um arquivo idêntico devolve o mesmo `fileId`, sem gravar outra cópia. O
        arquivo só passa a valer quando é registrado em `POST /treatment-documents`.
      parameters:
        - name: name
          in: query
          required: true
          description: Nome original do arquivo, com a extensão
          schema: { type: string, minLength: 1, maxLength: 255 }
      requestBody:
        required: true
        content:
          application/octet-stream: {}
      responses:
        '201':
          description: Arquivo recebido
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TreatmentFile' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '413':
          description: Arquivo acima de 25 MiB (`file_too_large`)
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '415':
          description: Tipo não aceito ou conteúdo diferente da extensão (`unsupported_file_type`)
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /treatment-documents/check:
    post:
      tags: [treatments]
      operationId: checkTreatmentDocuments
      summary: Diz quais reservas aceitam o documento, sem gravar nada (feature 003, FR-006)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [kind, reservations]
              additionalProperties: false
              properties:
                kind: { $ref: '#/components/schemas/TreatmentDocumentKind' }
                reservations:
                  type: array
                  minItems: 1
                  maxItems: 200
                  items: { $ref: '#/components/schemas/ReservationKey' }
      responses:
        '200':
          description: Desfecho previsto de cada reserva e os totais para a confirmação
          content:
            application/json:
              schema:
                type: object
                required: [items, acceptedCount, replacingCount, ignoredCount, acceptedTotalAmount]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/ReservationOutcome' }
                  acceptedCount: { type: integer }
                  replacingCount:
                    type: integer
                    description: Das aceitas, quantas já têm um documento atual desse tipo
                  ignoredCount: { type: integer }
                  acceptedTotalAmount:
                    type: string
                    pattern: '^[0-9]+\.[0-9]{2}$'
                    description: Soma do valor total das reservas aceitas, em BRL
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /treatment-documents:
    post:
      tags: [treatments]
      operationId: registerTreatmentDocuments
      summary: Registra a tratativa ou o comprovante em uma ou várias reservas (feature 003, FR-001, FR-006)
      description: |
        Cada reserva é gravada por inteiro ou não é gravada (FR-011). A resposta é 200 mesmo com
        reservas ignoradas ou com falha: o desfecho de cada uma está em `items`. Uma reserva que
        já tem um documento atual desse tipo tem o documento substituído.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [kind, fileId, fileName, reservations]
              additionalProperties: false
              properties:
                kind: { $ref: '#/components/schemas/TreatmentDocumentKind' }
                fileId: { type: string, pattern: '^[0-9a-f]{64}$' }
                fileName: { type: string, minLength: 1, maxLength: 255 }
                reservations:
                  type: array
                  minItems: 1
                  maxItems: 200
                  items: { $ref: '#/components/schemas/ReservationKey' }
      responses:
        '200':
          description: Desfecho de cada reserva
          content:
            application/json:
              schema:
                type: object
                required: [batchId, items]
                properties:
                  batchId: { type: string, format: uuid }
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/ReservationOutcome' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '415':
          description: O nome informado não tem a extensão do tipo do arquivo (`unsupported_file_type`)
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '422':
          description: O servidor não tem o arquivo informado (`file_not_found`)
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /treatment-documents/{documentId}:
    parameters:
      - $ref: '#/components/parameters/DocumentId'
    delete:
      tags: [treatments]
      operationId: removeTreatmentDocument
      summary: Desfaz o documento atual; pode ser revertido por 30 dias (feature 003, FR-004)
      responses:
        '204':
          description: Documento desfeito
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /treatment-documents/{documentId}/revert:
    parameters:
      - $ref: '#/components/parameters/DocumentId'
    post:
      tags: [treatments]
      operationId: revertTreatmentDocument
      summary: Volta um documento substituído ou desfeito a documento atual (feature 003, FR-013a)
      responses:
        '200':
          description: Tratativa atualizada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReservationTreatment' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /treatment-documents/{documentId}/file:
    parameters:
      - $ref: '#/components/parameters/DocumentId'
    get:
      tags: [treatments]
      operationId: getTreatmentDocumentFile
      summary: Baixa o arquivo de um documento, idêntico ao enviado (feature 003, FR-009)
      responses:
        '200':
          description: Arquivo, com o nome original em content-disposition
          content:
            application/pdf: {}
            image/png: {}
            image/jpeg: {}
            message/rfc822: {}
            application/vnd.ms-outlook: {}
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '410':
          description: Arquivo apagado pelo prazo de retenção (`document_purged`)
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /channels:
    get:
      tags: [reservations]
      operationId: listChannels
      summary: Canais presentes nas reservas gravadas, em ordem alfabética (feature 002)
      responses:
        '200':
          description: Lista de canais
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { type: string }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /evidence/{evidenceId}/{file}:
    parameters:
      - name: evidenceId
        in: path
        required: true
        schema: { type: string, format: uuid }
      - name: file
        in: path
        required: true
        schema: { type: string, enum: [screenshot, html, response] }
    get:
      tags: [evidence]
      operationId: getEvidenceFile
      summary: Baixa a captura de tela, o HTML sanitizado ou a resposta JSON de uma evidência (FR-024)
      responses:
        '200':
          description: Arquivo
          content:
            image/png: {}
            text/html: {}
            application/json: {}
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '410':
          description: Evidência expirada (retenção de 30 dias — FR-025)
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /reservations/selection:
    get:
      tags: [reservations]
      operationId: selectReservations
      summary: Todas as reservas de um filtro, até 2 000, para a seleção e a cópia para e-mail (feature 005, FR-030)
      description: |
        Mesmos filtros de GET /reservations, sem paginação. Devolve até 2 000 reservas na ordem da
        lista (`order`; sem ele, hotel e número), só com os campos que a seleção e a cópia para
        e-mail usam, e o total que o filtro encontrou. `truncated` = o total passou de 2 000; as
        primeiras foram devolvidas.
      parameters:
        - name: executionId
          in: query
          schema: { type: string, format: uuid }
        - name: hotelCode
          in: query
          schema: { type: array, items: { type: string } }
          style: form
          explode: true
        - name: classification
          in: query
          schema: { type: array, items: { $ref: '#/components/schemas/Classification' } }
          style: form
          explode: true
        - name: reservationStatus
          in: query
          schema: { type: array, items: { $ref: '#/components/schemas/ReservationStatus' } }
          style: form
          explode: true
        - name: notFound
          in: query
          schema: { type: boolean }
        - name: checkInFrom
          in: query
          schema: { type: string, format: date }
        - name: checkInTo
          in: query
          schema: { type: string, format: date }
        - name: q
          in: query
          description: >-
            Busca livre, como em GET /reservations (inclui o código de autorização do retorno do
            Comercial confirmado, feature 008)
          schema: { type: string, minLength: 2, maxLength: 100 }
        - name: channel
          in: query
          schema: { type: string, minLength: 1, maxLength: 100 }
        - name: amount
          in: query
          schema: { type: string, pattern: '^[0-9]+\.[0-9]{2}$' }
        - name: treatmentStatus
          in: query
          schema: { type: array, items: { $ref: '#/components/schemas/TreatmentStatus' } }
          style: form
          explode: true
        - name: pendingCharge
          in: query
          schema: { type: boolean }
        - name: situation
          in: query
          schema: { type: array, items: { $ref: '#/components/schemas/ReservationSituation' } }
          style: form
          explode: true
        - name: needsReview
          in: query
          schema: { type: boolean }
        - name: fromLegacy
          in: query
          schema: { type: boolean }
        - name: detailedSituation
          in: query
          schema: { type: array, items: { $ref: '#/components/schemas/ReservationDetailedSituation' } }
          style: form
          explode: true
        - $ref: '#/components/parameters/QuickFilter'
        - $ref: '#/components/parameters/ReservationOrder'
      responses:
        '200':
          description: Reservas do filtro, até 2 000
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReservationSelection' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /reservations/quick-filter-counts:
    get:
      tags: [reservations]
      operationId: countReservationQuickFilters
      summary: Contagem das reservas de cada filtro rápido (feature 006, FR-017)
      description: |
        Mesmos filtros de GET /reservations, sem `quickFilter`, `order` e paginação. `all` conta as
        reservas que atendem aos filtros ("Todas"); cada grupo conta as que, além disso, estão nele.
        A soma dos grupos pode passar de `all`: uma reserva pode estar em mais de um grupo.
      parameters:
        - name: executionId
          in: query
          schema: { type: string, format: uuid }
        - name: hotelCode
          in: query
          schema: { type: array, items: { type: string } }
          style: form
          explode: true
        - name: classification
          in: query
          schema: { type: array, items: { $ref: '#/components/schemas/Classification' } }
          style: form
          explode: true
        - name: reservationStatus
          in: query
          schema: { type: array, items: { $ref: '#/components/schemas/ReservationStatus' } }
          style: form
          explode: true
        - name: notFound
          in: query
          schema: { type: boolean }
        - name: checkInFrom
          in: query
          schema: { type: string, format: date }
        - name: checkInTo
          in: query
          schema: { type: string, format: date }
        - name: q
          in: query
          description: >-
            Busca livre, como em GET /reservations (inclui o código de autorização do retorno do
            Comercial confirmado, feature 008)
          schema: { type: string, minLength: 2, maxLength: 100 }
        - name: channel
          in: query
          schema: { type: string, minLength: 1, maxLength: 100 }
        - name: amount
          in: query
          schema: { type: string, pattern: '^[0-9]+\.[0-9]{2}$' }
        - name: treatmentStatus
          in: query
          schema: { type: array, items: { $ref: '#/components/schemas/TreatmentStatus' } }
          style: form
          explode: true
        - name: pendingCharge
          in: query
          schema: { type: boolean }
        - name: situation
          in: query
          schema: { type: array, items: { $ref: '#/components/schemas/ReservationSituation' } }
          style: form
          explode: true
        - name: needsReview
          in: query
          schema: { type: boolean }
        - name: fromLegacy
          in: query
          schema: { type: boolean }
        - name: detailedSituation
          in: query
          schema: { type: array, items: { $ref: '#/components/schemas/ReservationDetailedSituation' } }
          style: form
          explode: true
      responses:
        '200':
          description: Contagem de cada filtro rápido
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReservationQuickFilterCounts' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /reports/overview:
    get:
      tags: [reports]
      operationId: getReportOverview
      summary: Resumo do período de check-in, com uma linha por hotel (feature 007)
      description: |
        Reservas com check-in no período (inclusive as pontas), sem as situações "Ignorada
        (Hotelbeds 258)", "A revisar (sistema anterior)" e "Faturada" (FR-008a). Cada reserva cai
        numa faixa: pendente ("Falta cobrar" sem tratativa), solicitado ("Falta cobrar" com
        tratativa), recuperado (cobrada, com tratativa antes) ou cobrado anteriormente (cobrada, sem
        tratativa); "Cancelada sem cobrança" conta em `reservations`, sem valor. Em aberto vale o
        valor a cobrar; cobrado vale o valor cobrado exibido ou, sem ele, o total. Os totais são a
        soma de `hotelRows`. Sem dado de hóspede. Para os dois perfis.
        Desde a 1.11.0, aceita os filtros da lista de reservas (`hotelCode`, `detailedSituation`,
        `reservationStatus`, `channel`, `fromLegacy` e `notFound`), com a mesma regra de
        `GET /reservations`; com `hotelCode`, `hotels.total` conta só os hotéis informados.
      parameters:
        - name: checkInFrom
          in: query
          required: true
          schema: { type: string, format: date }
        - name: checkInTo
          in: query
          required: true
          schema: { type: string, format: date }
        - name: hotelCode
          in: query
          description: Só os hotéis informados (1.11.0)
          schema: { type: array, items: { type: string } }
          style: form
          explode: true
        - name: detailedSituation
          in: query
          description: >-
            Situação detalhada, como em GET /reservations (1.11.0). As três que o relatório deixa
            de fora continuam fora.
          schema: { type: array, items: { $ref: '#/components/schemas/ReservationDetailedSituation' } }
          style: form
          explode: true
        - name: reservationStatus
          in: query
          description: Ativa, cancelada ou não identificada no Hunit (1.11.0)
          schema: { type: array, items: { $ref: '#/components/schemas/ReservationStatus' } }
          style: form
          explode: true
        - name: channel
          in: query
          description: Canal exatamente como em Reservation.channel (1.11.0)
          schema: { type: string, minLength: 1, maxLength: 100 }
        - name: fromLegacy
          in: query
          description: >-
            true = só as importadas do sistema anterior; false = só as que não vieram de lá
            (1.11.0)
          schema: { type: boolean }
        - name: notFound
          in: query
          description: true = só as "não encontradas na última verificação" (1.11.0)
          schema: { type: boolean }
      responses:
        '200':
          description: Resumo do período
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReportOverview' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /reservations/{hotelCode}/{reservationNumber}/no-charge:
    parameters:
      - $ref: '#/components/parameters/HotelCode'
      - $ref: '#/components/parameters/ReservationNumber'
    post:
      tags: [treatments]
      operationId: markReservationNoCharge
      summary: Marca a reserva como cancelada sem cobrança (feature 008, FR-018 a FR-022) — somente operador
      description: |
        A reserva passa a ter a situação `cancelled_no_charge` (classificação efetiva): sai de
        "Falta cobrar", entra em "Concluídas", não é mais enviada ao Comercial e a linha da planilha
        vai para "Concluídas" com o valor a cobrar R$ 0,00. A classificação do Hunit não muda.
        `expectedSituation` é a situação detalhada que a pessoa viu: se mudou, nada é gravado
        (`reservation_changed`). Recusada (`no_charge_not_accepted`, com `reason`) se já está
        marcada, já concluída, com comprovante ou com retorno do Comercial aguardando validação.
        Não acessa o Hunit.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NoChargeRequest' }
      responses:
        '200':
          description: Reserva atualizada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Reservation' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /reservations/{hotelCode}/{reservationNumber}/no-charge/undo:
    parameters:
      - $ref: '#/components/parameters/HotelCode'
      - $ref: '#/components/parameters/ReservationNumber'
    post:
      tags: [treatments]
      operationId: undoReservationNoCharge
      summary: Desfaz a marcação "Cancelada sem cobrança" (feature 008, FR-021) — somente operador
      description: |
        Tudo volta a ser derivado da classificação do Hunit, inclusive a linha da planilha. Recusado
        (`no_charge_not_active`) se a marcação informada já foi desfeita ou não é a ativa. Não
        acessa o Hunit.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [markId]
              additionalProperties: false
              properties:
                markId: { type: string, format: uuid }
      responses:
        '200':
          description: Reserva atualizada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Reservation' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /reservations/{hotelCode}/{reservationNumber}/commercial:
    parameters:
      - $ref: '#/components/parameters/HotelCode'
      - $ref: '#/components/parameters/ReservationNumber'
    get:
      tags: [commercial]
      operationId: getReservationCommercial
      summary: Linha da reserva na planilha do Comercial, retornos e histórico do Comercial (feature 005)
      description: |
        O histórico das tratativas (feature 003) continua em `.../treatment`; o app mescla os dois
        por data. Os retornos vêm do mais recente para o mais antigo.
      responses:
        '200':
          description: Linha, retornos e histórico
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CommercialDetail' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /reservations/{hotelCode}/{reservationNumber}/commercial/cancel:
    parameters:
      - $ref: '#/components/parameters/HotelCode'
      - $ref: '#/components/parameters/ReservationNumber'
    post:
      tags: [commercial]
      operationId: cancelCommercialLine
      summary: Desfaz o envio da reserva ao Comercial (feature 005) — somente operador
      description: |
        A linha vai para "Concluídas" com a situação "Pedido cancelado pelo Financeiro" e pode ser
        revertida por 30 dias. Recusado com retorno do Comercial aguardando validação
        (`return_awaiting_validation`) ou sem linha aberta (`not_in_commercial_sheet`). Não acessa o
        Hunit.
      responses:
        '200':
          description: Linha atualizada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CommercialLine' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /reservations/{hotelCode}/{reservationNumber}/commercial/restore:
    parameters:
      - $ref: '#/components/parameters/HotelCode'
      - $ref: '#/components/parameters/ReservationNumber'
    post:
      tags: [commercial]
      operationId: restoreCommercialLine
      summary: Reverte o envio desfeito, em até 30 dias (feature 005) — somente operador
      description: |
        A linha volta para "A cobrar". Recusado depois de 30 dias (`restore_expired`), se a linha não
        está cancelada (`not_in_commercial_sheet`) ou se a reserva não aceita mais o envio
        (`not_eligible_for_treatment`). Não acessa o Hunit.
      responses:
        '200':
          description: Linha atualizada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CommercialLine' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /commercial-dispatches/check:
    post:
      tags: [commercial]
      operationId: checkCommercialDispatch
      summary: Diz quais reservas aceitam o envio ao Comercial, sem gravar nada e sem acessar o Hunit (feature 005, FR-001)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reservations]
              additionalProperties: false
              properties:
                reservations:
                  type: array
                  minItems: 1
                  maxItems: 2000
                  items: { $ref: '#/components/schemas/ReservationKey' }
      responses:
        '200':
          description: Reservas aceitas, as que ficam de fora e o total dos valores das aceitas
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CommercialDispatchCheck' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /commercial-dispatches:
    get:
      tags: [commercial]
      operationId: listCommercialDispatches
      summary: Envios ao Comercial, dos mais recentes para os mais antigos (feature 005, FR-020)
      parameters:
        - name: active
          in: query
          description: true = só os ativos (fila, em andamento, aguardando token); false = só os encerrados
          schema: { type: boolean }
        - name: purpose
          in: query
          description: >-
            send = só os envios ao Comercial (padrão, o comportamento até a 1.8.0); hunit_check = só
            as verificações da fila "Cobradas no Hunit"; all = os dois (feature 008)
          schema:
            type: string
            enum: [send, hunit_check, all]
            default: send
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Página de envios
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/CommercialDispatchSummary' }
                  nextCursor: { type: [string, 'null'] }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [commercial]
      operationId: createCommercialDispatch
      summary: Envia reservas ao Comercial, com login no Hunit e verificação de cada uma (feature 005, FR-001 a FR-007) — somente operador
      description: |
        Cria o envio e o executa em segundo plano, com os mesmos estados de uma execução: o login
        pede o token (`awaiting_2fa`), e depois cada reserva é verificada no Hunit (só leitura), uma
        por vez. As que ainda exigem cobrança entram na planilha do Comercial e ficam "Tratativa
        enviada"; as que deixaram de exigir são retiradas; as que não puderam ser verificadas ficam de
        fora. A elegibilidade é conferida de novo aqui: as que não aceitam ficam como `ignored`.
        Credenciais só em memória, como em POST /executions.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [credentials, reservations]
              additionalProperties: false
              properties:
                credentials: { $ref: '#/components/schemas/HunitCredentials' }
                reservations:
                  type: array
                  minItems: 1
                  maxItems: 2000
                  items: { $ref: '#/components/schemas/ReservationKey' }
      responses:
        '202':
          description: Envio criado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CommercialDispatch' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: |
            Já há execução ou envio ativo na mesma conta do Hunit (`account_busy`) ou a planilha do
            Comercial não está configurada no servidor (`commercial_sheet_not_configured`)
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '422':
          description: Nenhuma das reservas aceita o envio (`no_eligible_reservations`)
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /commercial-dispatches/{dispatchId}:
    parameters:
      - $ref: '#/components/parameters/DispatchId'
    get:
      tags: [commercial]
      operationId: getCommercialDispatch
      summary: Estado do envio e o resultado de cada reserva (feature 005, FR-007)
      responses:
        '200':
          description: Envio
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CommercialDispatch' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /commercial-dispatches/{dispatchId}/events:
    parameters:
      - $ref: '#/components/parameters/DispatchId'
    get:
      tags: [commercial]
      operationId: streamCommercialDispatchEvents
      summary: Stream de eventos do envio em tempo real (Server-Sent Events)
      description: |
        Como /executions/{executionId}/events: cada mensagem tem `id` (sequencial), `event` (tipo) e
        `data` (JSON de CommercialDispatchEvent); `Last-Event-ID` reenvia os posteriores; o stream
        termina depois do `status_changed` com estado final.
      parameters:
        - name: Last-Event-ID
          in: header
          schema: { type: string }
      responses:
        '200':
          description: Stream aberto
          content:
            text/event-stream:
              schema: { $ref: '#/components/schemas/CommercialDispatchEvent' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /commercial-dispatches/{dispatchId}/two-factor:
    parameters:
      - $ref: '#/components/parameters/DispatchId'
    post:
      tags: [commercial]
      operationId: sendCommercialDispatchTwoFactor
      summary: Envia o token 2FA do envio (feature 005, FR-002) — somente operador
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              additionalProperties: false
              properties:
                token:
                  type: string
                  pattern: '^[0-9]{4,10}$'
                  writeOnly: true
      responses:
        '202':
          description: Token entregue ao envio; o resultado chega pelo estado/eventos
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: O envio não está aguardando o token (`not_awaiting_two_factor`)
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /commercial-dispatches/{dispatchId}/cancel:
    parameters:
      - $ref: '#/components/parameters/DispatchId'
    post:
      tags: [commercial]
      operationId: cancelCommercialDispatch
      summary: Cancela o envio (feature 005, FR-007) — somente operador
      description: |
        As reservas já processadas ficam como estão; as restantes ficam "não verificadas: envio
        cancelado" e podem ser retomadas.
      responses:
        '202':
          description: Cancelamento solicitado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CommercialDispatch' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Envio já encerrado (`dispatch_already_finished`)
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /commercial-dispatches/{dispatchId}/resume:
    parameters:
      - $ref: '#/components/parameters/DispatchId'
    post:
      tags: [commercial]
      operationId: resumeCommercialDispatch
      summary: Retoma o envio com as reservas não verificadas, com novo login e token (feature 005, FR-007) — somente operador
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [credentials]
              additionalProperties: false
              properties:
                credentials: { $ref: '#/components/schemas/HunitCredentials' }
      responses:
        '202':
          description: Novo envio criado (parentDispatchId = envio original)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CommercialDispatch' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: |
            Envio ainda ativo ou conta ocupada (`account_busy`), sem reservas não verificadas
            (`nothing_to_resume`), já retomado (`dispatch_already_resumed`) ou planilha não
            configurada (`commercial_sheet_not_configured`)
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /commercial-hunit-charges:
    get:
      tags: [commercial]
      operationId: listCommercialHunitCharges
      summary: Fila "Cobradas no Hunit" — relatos do Comercial e a verificação no Hunit (feature 008, FR-013)
      description: |
        Os relatos "Cobrada no Hunit" com a situação derivada da última leitura da reserva no Hunit
        depois do relato: aguardando verificação e não encontradas que ainda exigem cobrança sempre;
        confirmadas e não encontradas que não exigem mais cobrança por 7 dias depois da leitura que
        as definiu. Ordem: aguardando, não encontrada, confirmada; leitura mais antiga primeiro.
        Sem paginação. Não acessa o Hunit.
      responses:
        '200':
          description: A fila e as contagens
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HunitChargeQueue' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /commercial-hunit-charges/check:
    post:
      tags: [commercial]
      operationId: checkCommercialHunitCharges
      summary: '"Verificar agora": confere no Hunit as reservas da fila (feature 008, FR-014) — somente operador'
      description: |
        Cria uma verificação (um envio com `purpose` = `hunit_check`) com os relatos aguardando
        verificação e os não encontrados que ainda exigem cobrança, e a executa como um envio: login
        com token, leitura de cada reserva no Hunit (só leitura), cancelamento e retomada pelas rotas
        de `/commercial-dispatches/{dispatchId}`. Não escreve linha nova na planilha. Credenciais só
        em memória, como em POST /executions.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [credentials]
              additionalProperties: false
              properties:
                credentials: { $ref: '#/components/schemas/HunitCredentials' }
      responses:
        '202':
          description: Verificação criada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CommercialDispatch' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: |
            Nenhum relato para conferir (`no_reports_to_check`) ou já há execução ou envio ativo na
            mesma conta do Hunit (`account_busy`)
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /commercial-returns/confirm:
    post:
      tags: [commercial]
      operationId: confirmCommercialReturns
      summary: Confirma de uma vez os retornos aguardando validação de várias reservas (feature 005, FR-016a) — somente operador
      description: |
        Uma transação por reserva. Reservas sem retorno aguardando validação ficam de fora, com o
        motivo. A resposta é 200 mesmo com reservas ignoradas ou com falha. Não acessa o Hunit.
        Com `includeCancellations` (feature 008, homologação), a reserva com a situação "Cancelada"
        do Comercial aguardando validação é confirmada como em
        `/reservations/{h}/{n}/commercial/cancellation/confirm` (marcada como "Cancelada sem
        cobrança"); a que não aceita a marcação fica de fora com `cancellation_not_accepted`.
        Desde a 1.12.0, a reserva com um retorno de situação livre (feature 009) fica de fora com
        `no_return_awaiting_validation`: cada uma pede uma decisão própria.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reservations]
              additionalProperties: false
              properties:
                reservations:
                  type: array
                  minItems: 1
                  maxItems: 2000
                  items: { $ref: '#/components/schemas/ReservationKey' }
                includeCancellations:
                  type: boolean
                  description: >-
                    Confirma também as "Cancelada" aguardando validação (feature 008); sem o campo,
                    como antes (só retornos)
      responses:
        '200':
          description: Desfecho de cada reserva
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConfirmationBatchResult' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /commercial-returns/{returnId}/confirm:
    parameters:
      - $ref: '#/components/parameters/ReturnId'
    post:
      tags: [commercial]
      operationId: confirmCommercialReturn
      summary: Confirma o retorno do Comercial; a reserva passa a "Comprovante enviado" (feature 005, FR-016) — somente operador
      description: |
        Desde a 1.12.0, um retorno com situação livre (feature 009) não é confirmado por aqui: a
        resposta é 409 `situation_return_needs_decision`; use
        `/commercial-returns/{returnId}/situation/confirm`.
      responses:
        '200':
          description: Tratativa atualizada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReservationTreatment' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: >-
            O retorno não está aguardando validação (`return_not_awaiting_validation`) ou é um
            retorno com situação livre (`situation_return_needs_decision`, desde a 1.12.0)
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /commercial-returns/{returnId}/situation/confirm:
    parameters:
      - $ref: '#/components/parameters/ReturnId'
    post:
      tags: [commercial]
      operationId: confirmCommercialSituationReturn
      summary: Confirma o retorno com situação livre do Comercial como cobrado ou como cancelado sem cobrança (feature 009) — somente operador
      description: |
        Só para o retorno com uma situação livre (`situationReturn`) aguardando validação. Com
        `as = charged`, vale como comprovante, como a confirmação de um retorno da maquininha; se
        o Comercial não informou o valor cobrado, `chargedAmount` é obrigatório e é gravado como
        valor informado à mão (`chargedAmountOrigin = manual`). Com `as = no_charge`, marca a
        reserva como "Cancelada sem cobrança" (as regras de `POST /reservations/{h}/{n}/no-charge`,
        com a observação de que a situação veio do Comercial); desfazer a marcação devolve o
        retorno para validar. A recusa é `POST /commercial-returns/{returnId}/reject`. Não acessa o
        Hunit.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [as]
              additionalProperties: false
              properties:
                as:
                  type: string
                  description: >-
                    charged = "Confirmar como cobrada" (vale como comprovante); no_charge =
                    "Confirmar como cancelada sem cobrança"
                  enum: [charged, no_charge]
                chargedAmount:
                  $ref: '#/components/schemas/Money'
                  description: >-
                    Só com as = charged e só quando o Comercial não informou o valor; gravado como
                    valor informado à mão
                note:
                  type: string
                  minLength: 1
                  maxLength: 500
                  description: Só com as = no_charge; observação opcional da marcação
      responses:
        '200':
          description: Reserva atualizada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Reservation' }
        '400':
          description: >-
            Corpo fora do contrato, valor cobrado faltando (`charged_amount_required`) ou mandado
            quando o Comercial já informou (`charged_amount_from_commercial`)
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: >-
            O retorno não tem situação livre (`not_a_situation_return`), não está aguardando
            validação (`return_not_awaiting_validation`) ou a reserva não aceita a marcação
            (`no_charge_not_accepted`, com `reason`)
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /reservations/{hotelCode}/{reservationNumber}/commercial/cancellation/confirm:
    parameters:
      - $ref: '#/components/parameters/HotelCode'
      - $ref: '#/components/parameters/ReservationNumber'
    post:
      tags: [commercial]
      operationId: confirmCommercialCancellation
      summary: Confirma a situação "Cancelada" informada pelo Comercial (feature 008, homologação) — somente operador
      description: |
        Marca a reserva como "Cancelada sem cobrança" (as mesmas regras de
        `POST /reservations/{h}/{n}/no-charge`, com a observação de que a situação veio do
        Comercial) e a linha da planilha vai para "Concluídas". Desfazer a marcação devolve a
        "Cancelada" para validar. Não acessa o Hunit.
      responses:
        '200':
          description: Reserva atualizada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Reservation' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: >-
            Sem "Cancelada" aguardando validação (`no_cancellation_awaiting_validation`) ou a
            reserva não aceita a marcação (`no_charge_not_accepted`, com `reason`)
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /reservations/{hotelCode}/{reservationNumber}/commercial/cancellation/reject:
    parameters:
      - $ref: '#/components/parameters/HotelCode'
      - $ref: '#/components/parameters/ReservationNumber'
    post:
      tags: [commercial]
      operationId: rejectCommercialCancellation
      summary: Recusa a situação "Cancelada" informada pelo Comercial, com o motivo (feature 008, homologação) — somente operador
      description: |
        O motivo aparece para o Comercial na planilha ("Recusado pelo Financeiro: <motivo>"): não
        escreva dado pessoal do hóspede. A reserva não muda.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              additionalProperties: false
              properties:
                reason: { type: string, minLength: 1, maxLength: 500 }
      responses:
        '200':
          description: Reserva atualizada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Reservation' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Sem "Cancelada" aguardando validação (`no_cancellation_awaiting_validation`)
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /commercial-returns/{returnId}/reject:
    parameters:
      - $ref: '#/components/parameters/ReturnId'
    post:
      tags: [commercial]
      operationId: rejectCommercialReturn
      summary: Recusa o retorno do Comercial com o motivo; a reserva volta a "Tratativa enviada" (feature 005, FR-017) — somente operador
      description: |
        O motivo aparece para o Comercial na planilha ("Recusado pelo Financeiro: <motivo>"): não
        escreva dado pessoal do hóspede.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              additionalProperties: false
              properties:
                reason: { type: string, minLength: 1, maxLength: 500 }
      responses:
        '200':
          description: Tratativa atualizada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReservationTreatment' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: O retorno não está aguardando validação (`return_not_awaiting_validation`)
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /commercial-returns/{returnId}/undo-confirmation:
    parameters:
      - $ref: '#/components/parameters/ReturnId'
    post:
      tags: [commercial]
      operationId: undoCommercialReturnConfirmation
      summary: Desfaz a confirmação do retorno; ele volta a aguardar validação (feature 005) — somente operador
      responses:
        '200':
          description: Tratativa atualizada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReservationTreatment' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: O retorno não está confirmado (`return_not_confirmed`)
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /treatment-reviews:
    post:
      tags: [treatments]
      operationId: confirmTreatmentReviews
      summary: Confirma o alerta "Verificar" de várias reservas de uma vez (feature 005, FR-029) — somente operador
      description: |
        Para cada reserva, a mesma regra de POST .../treatment/review (feature 003, FR-002a): só tira
        o alerta e registra a confirmação no histórico, com o status do Hunit confirmado. Uma
        transação por reserva; sem alerta, a reserva fica de fora (`no_review_alert`). Não acessa o
        Hunit.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reservations]
              additionalProperties: false
              properties:
                reservations:
                  type: array
                  minItems: 1
                  maxItems: 2000
                  items: { $ref: '#/components/schemas/ReservationKey' }
      responses:
        '200':
          description: Desfecho de cada reserva e a contagem das confirmadas por status do Hunit
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConfirmationBatchResult' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /commercial-sheet:
    get:
      tags: [commercial]
      operationId: getCommercialSheetStatus
      summary: Estado da planilha do Comercial — pendências, última leitura, falha e retornos com problema (feature 005, FR-013)
      description: Nunca mostra o identificador da planilha nem a chave de acesso (FR-022).
      responses:
        '200':
          description: Estado da planilha
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CommercialSheetStatus' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /commercial-sheet/read:
    post:
      tags: [commercial]
      operationId: readCommercialSheet
      summary: Lê os retornos e atualiza a planilha agora (feature 005, FR-014) — somente operador
      description: |
        Faz uma rodada completa (leitura dos retornos e atualização da planilha) e responde quando
        ela termina; se passar de 50 s, responde 202 e a rodada continua. Com a planilha
        indisponível, responde 503 sem mudar nada no sistema.
      responses:
        '200':
          description: Rodada concluída
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CommercialSheetRead' }
        '202':
          description: A rodada continua em segundo plano; o resultado aparece em GET /commercial-sheet
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CommercialSheetStatus' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: A planilha do Comercial não está configurada (`commercial_sheet_not_configured`)
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '503':
          description: A planilha está indisponível (`commercial_sheet_unavailable`); nada mudou
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

components:
  securitySchemes:
    apiKey:
      type: http
      scheme: bearer
      description: Chave de API do cliente autorizado (nível operator ou reader — FR-007)

  parameters:
    ExecutionId:
      name: executionId
      in: path
      required: true
      schema: { type: string, format: uuid }
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 500, default: 50 }
    Cursor:
      name: cursor
      in: query
      schema: { type: string }
    QuickFilter:
      name: quickFilter
      in: query
      description: >-
        Só as reservas de um filtro rápido (feature 006, FR-016), combinado com os demais filtros.
        Omitido = "Todas".
      schema: { $ref: '#/components/schemas/ReservationQuickFilter' }
    ReservationOrder:
      name: order
      in: query
      description: >-
        Ordem da lista (feature 006). Omitido = hotel_number, a ordem da 1.7.0. O cursor de uma
        página só vale com a mesma ordem (com outra, 400 validation_error).
      schema: { $ref: '#/components/schemas/ReservationOrder' }
    DocumentId:
      name: documentId
      in: path
      required: true
      schema: { type: string, format: uuid }
    HotelCode:
      name: hotelCode
      in: path
      required: true
      schema: { type: string }
    ReservationNumber:
      name: reservationNumber
      in: path
      required: true
      schema: { type: string }
    DispatchId:
      name: dispatchId
      in: path
      required: true
      schema: { type: string, format: uuid }
    ReturnId:
      name: returnId
      in: path
      required: true
      schema: { type: string, format: uuid }

  responses:
    BadRequest:
      description: Requisição inválida (parâmetro, corpo ou formato fora do contrato)
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Unauthorized:
      description: Chave de API ausente, inválida ou revogada
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Forbidden:
      description: "Ação não permitida para o nível do cliente (ex.: reader tentando iniciar)"
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    NotFound:
      description: Recurso não encontrado
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Conflict:
      description: A ação não é possível na situação atual (o `code` diz o motivo)
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }

  schemas:
    Problem:
      type: object
      description: RFC 9457 (problem details)
      required: [type, title, status, code]
      properties:
        type: { type: string }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        code:
          type: string
          description: Código estável para tratamento pelos clientes
          enum:
            - validation_error
            - unauthorized
            - forbidden_for_role
            - not_found
            - execution_already_active
            - not_awaiting_two_factor
            - execution_already_finished
            - nothing_to_resume
            - execution_already_resumed
            - evidence_expired
            - empty_file
            - file_too_large
            - unsupported_file_type
            - file_not_found
            - not_eligible_for_treatment
            - document_not_current
            - document_not_revertible
            - proof_required
            - document_purged
            - account_busy
            - commercial_sheet_not_configured
            - commercial_sheet_unavailable
            - no_eligible_reservations
            - dispatch_already_finished
            - dispatch_already_resumed
            - return_awaiting_validation
            - return_not_awaiting_validation
            - return_not_confirmed
            - not_in_commercial_sheet
            - restore_expired
            - no_charge_not_accepted
            - reservation_changed
            - no_charge_not_active
            - no_reports_to_check
            - no_cancellation_awaiting_validation
            - situation_return_needs_decision
            - not_a_situation_return
            - charged_amount_required
            - charged_amount_from_commercial
            - internal_error
        reason:
          type: string
          description: >-
            Só em no_charge_not_accepted (feature 008): already_marked = já marcada; not_accepting =
            a situação não aceita a marcação (já concluída); has_proof = já tem comprovante;
            return_awaiting_validation = há retorno do Comercial aguardando validação
          enum: [already_marked, not_accepting, has_proof, return_awaiting_validation]

    HunitCredentials:
      type: object
      required: [username, password]
      additionalProperties: false
      writeOnly: true
      properties:
        username: { type: string, minLength: 1, writeOnly: true }
        password: { type: string, minLength: 1, writeOnly: true }

    Period:
      type: object
      required: [from, to]
      description: Período de check-in; qualquer intervalo, inclusive retroativo (FR-010a). from <= to.
      properties:
        from: { type: string, format: date }
        to: { type: string, format: date }

    StartExecutionRequest:
      type: object
      required: [credentials, period]
      additionalProperties: false
      properties:
        credentials: { $ref: '#/components/schemas/HunitCredentials' }
        period: { $ref: '#/components/schemas/Period' }
        hotelCodes:
          type: [array, 'null']
          description: Omitido ou null = todos os hotéis do catálogo (FR-009)
          items: { type: string }
          minItems: 1

    ExecutionStatus:
      type: string
      enum: [queued, running, awaiting_2fa, completed, failed, cancelled]

    ExecutionEndReason:
      type: string
      enum:
        - invalid_credentials
        - invalid_token
        - two_factor_timeout
        - hunit_unavailable
        - hunit_screen_not_recognized
        - session_expired
        - server_restarted
        - cancelled_by_client
        - internal_error

    HotelRunStatus:
      type: string
      enum: [pending, running, completed, failed, cancelled]

    Classification:
      type: string
      description: |
        Situação de cobrança da reserva (FR-013). Reserva sem pré-pagamento: `invoiced` (faturada,
        sem ação) ou `charge_at_terminal` (forma cartão de crédito: cobrar na maquininha), conforme
        a forma de pagamento informada pelo Hunit; sem forma informada, `cancelled_no_charge` se a
        reserva está cancelada (cancelamento antecipado ou no-show isento, desde a versão 1.3.0) ou
        `analysis_error` se está ativa; forma desconhecida → `analysis_error`.
        `not_virtual_card` = "A revisar (sistema anterior)" (desde a versão 1.6.0; antes, obsoleta
        desde a 1.2.0): não é produzida pelas execuções; só aparece em reservas importadas do
        sistema anterior cuja classificação não tem correspondência (feature 004, FR-007a) e sai na
        primeira verificação pelo HUNIT Control. Aceita tratativa e comprovante, não entra em
        `pendingCharge` e não gera `needsReview`.
      enum:
        - ignored_hotelbeds_258
        - invoiced
        - charge_at_terminal
        - cancelled_no_charge
        - not_virtual_card
        - virtual_card_charge_error
        - virtual_card_already_charged
        - virtual_card_validated_only
        - virtual_card_pending_charge
        - analysis_error

    ReservationStatus:
      type: string
      enum: [active, cancelled, unknown]

    ClassificationCounts:
      type: object
      additionalProperties: false
      properties:
        ignored_hotelbeds_258: { type: integer }
        invoiced: { type: integer }
        charge_at_terminal: { type: integer }
        cancelled_no_charge: { type: integer }
        not_virtual_card: { type: integer, description: Obsoleta (ver Classification) }
        virtual_card_charge_error: { type: integer }
        virtual_card_already_charged: { type: integer }
        virtual_card_validated_only: { type: integer }
        virtual_card_pending_charge: { type: integer }
        analysis_error: { type: integer }

    Hotel:
      type: object
      required: [code, name, available, lastSeenAt]
      properties:
        code: { type: string }
        name: { type: string }
        available:
          type: boolean
          description: true enquanto alguma conta do Hunit acessar o hotel (FR-008)
        lastSeenAt: { type: string, format: date-time }

    ExecutionSummary:
      type: object
      required: [id, status, period, createdAt, requestedClient]
      properties:
        id: { type: string, format: uuid }
        requestedClient: { type: string, description: Nome do cliente que iniciou (ou retomou) }
        parentExecutionId: { type: [string, 'null'], format: uuid }
        status: { $ref: '#/components/schemas/ExecutionStatus' }
        endReason:
          oneOf:
            - $ref: '#/components/schemas/ExecutionEndReason'
            - type: 'null'
        period: { $ref: '#/components/schemas/Period' }
        createdAt: { type: string, format: date-time }
        finishedAt: { type: [string, 'null'], format: date-time }

    Execution:
      allOf:
        - $ref: '#/components/schemas/ExecutionSummary'
        - type: object
          required: [hotels, counts, recentEvents, warnings]
          properties:
            twoFactorDeadline:
              type: [string, 'null']
              format: date-time
              description: Prazo para envio do token quando status = awaiting_2fa
            current:
              type: [object, 'null']
              properties:
                hotelCode: { type: string }
                page: { type: integer }
                pagesTotal: { type: [integer, 'null'] }
                reservationNumber: { type: [string, 'null'] }
            hotels:
              type: array
              items:
                type: object
                required: [hotelCode, status]
                properties:
                  hotelCode: { type: string }
                  hotelName: { type: string }
                  status: { $ref: '#/components/schemas/HotelRunStatus' }
                  pagesDone: { type: [integer, 'null'] }
                  pagesTotal: { type: [integer, 'null'] }
                  reservationsSeen: { type: integer }
                  durationSeconds: { type: [integer, 'null'] }
                  counts: { $ref: '#/components/schemas/ClassificationCounts' }
                  failureReason: { type: [string, 'null'] }
            counts: { $ref: '#/components/schemas/ClassificationCounts' }
            timing:
              type: object
              description: Medição e estimativa (FR-021a)
              properties:
                avgSecondsPerReservation: { type: [number, 'null'] }
                avgSecondsPerHotel: { type: [number, 'null'] }
                estimatedRemainingSeconds: { type: [integer, 'null'] }
            recentEvents:
              type: array
              maxItems: 50
              items: { $ref: '#/components/schemas/ExecutionEvent' }
            warnings:
              type: array
              maxItems: 20
              description: |
                Os 20 eventos `warning` mais recentes da execução, mais recentes primeiro (feature
                002). Inclui as novas tentativas por erro passageiro do Hunit e o hotel que a conta
                não acessa.
              items: { $ref: '#/components/schemas/ExecutionEvent' }

    ExecutionEvent:
      type: object
      required: [id, at, type, message]
      properties:
        id: { type: string }
        at: { type: string, format: date-time }
        type:
          type: string
          enum:
            - status_changed
            - catalog_updated
            - hotel_started
            - page_done
            - reservation_classified
            - hotel_completed
            - hotel_failed
            - evidence_recorded
            - warning
        status: { $ref: '#/components/schemas/ExecutionStatus' }
        hotelCode: { type: [string, 'null'] }
        reservationNumber: { type: [string, 'null'] }
        message: { type: string }

    Money:
      type: [string, 'null']
      pattern: '^-?[0-9]+\.[0-9]{2}$'
      description: Valor decimal em BRL

    Reservation:
      type: object
      required:
        - hotelCode
        - reservationNumber
        - reservationStatus
        - classification
        - reason
        - firstVerifiedAt
        - lastVerifiedAt
        - verificationCount
        - treatment
        - amountToCharge
        - noCharge
      properties:
        hotelCode: { type: string }
        reservationNumber: { type: string }
        guestName: { type: [string, 'null'], description: null após anonimização (FR-026) }
        channel: { type: [string, 'null'] }
        checkIn: { type: [string, 'null'], format: date }
        checkOut: { type: [string, 'null'], format: date }
        stayPeriod: { type: [string, 'null'] }
        totalAmount: { $ref: '#/components/schemas/Money' }
        reservationStatus: { $ref: '#/components/schemas/ReservationStatus' }
        classification: { $ref: '#/components/schemas/Classification' }
        reason: { type: string }
        paymentForm:
          type: [string, 'null']
          description: >-
            Forma de pagamento como o Hunit informa (ex.: "cartão de crédito"); null = não
            informada. Decide a situação das reservas sem pré-pagamento (FR-013, regra 2).
        payment:
          type: object
          properties:
            prePaymentFound: { type: boolean }
            chargedAt: { type: [string, 'null'], format: date-time }
            chargedBy: { type: [string, 'null'] }
            chargedAmount: { $ref: '#/components/schemas/Money' }
            transactionId: { type: [string, 'null'] }
            authorizationCode: { type: [string, 'null'] }
            processorReference: { type: [string, 'null'] }
            isInstallment: { type: [boolean, 'null'] }
            installmentCount: { type: [integer, 'null'] }
            installmentAmount: { $ref: '#/components/schemas/Money' }
            prePaymentState: { type: [string, 'null'] }
            prePaymentMessage: { type: [string, 'null'] }
            chargeActionVisible: { type: boolean }
        tracking:
          type: object
          properties:
            changedFields: { type: array, items: { type: string } }
            statusChanged: { type: boolean }
            previousClassification:
              oneOf:
                - $ref: '#/components/schemas/Classification'
                - type: 'null'
            previousReservationStatus:
              oneOf:
                - $ref: '#/components/schemas/ReservationStatus'
                - type: 'null'
            statusChangedAt: { type: [string, 'null'], format: date-time }
            notFoundSince:
              type: [string, 'null']
              format: date-time
              description: Preenchido = "não encontrada na última verificação" (FR-018a)
        firstVerifiedAt:
          type: string
          format: date-time
          description: Inclui as verificações do sistema anterior quando a reserva foi importada (feature 004, FR-010)
        lastVerifiedAt: { type: string, format: date-time }
        verificationCount:
          type: integer
          minimum: 1
          description: Inclui as verificações do sistema anterior quando a reserva foi importada (feature 004, FR-010)
        lastExecutionId:
          type: string
          format: uuid
          description: Ausente = reserva só do sistema anterior, ainda não verificada pelo HUNIT Control (feature 004)
        anonymized: { type: boolean }
        treatment: { $ref: '#/components/schemas/ReservationTreatment' }
        legacy:
          description: Origem "Sistema anterior" (feature 004, FR-011). null = a reserva não veio da importação.
          oneOf:
            - type: 'null'
            - $ref: '#/components/schemas/ReservationLegacyOrigin'
        commercial:
          description: >-
            Envio ao Comercial pela planilha (feature 005). null = a reserva nunca foi enviada pela
            planilha (pode ter tratativa por e-mail, feature 003).
          oneOf:
            - type: 'null'
            - $ref: '#/components/schemas/CommercialSummary'
        amountToCharge:
          description: >-
            Valor a cobrar (feature 008): totalAmount, ou 0.00 com a marcação "Cancelada sem
            cobrança" ativa (totalAmount continua o do Hunit)
          $ref: '#/components/schemas/Money'
        noCharge:
          description: >-
            Marcação "Cancelada sem cobrança" ativa (feature 008); null = sem marcação. Com ela,
            treatment.situation e treatment.detailedSituation são cancelled_no_charge e a
            classificação (do Hunit) não muda.
          oneOf:
            - type: 'null'
            - $ref: '#/components/schemas/ReservationNoCharge'

    ReservationLegacyOrigin:
      type: object
      description: O que o sistema anterior registrou sobre a reserva importada (feature 004)
      required:
        [importedAt, originalClassification, originalPreviousClassification, firstVerifiedAt, lastVerifiedAt, verificationCount, merged]
      properties:
        importedAt: { type: string, format: date-time, description: Primeira importação que trouxe a reserva }
        originalClassification:
          type: string
          description: >-
            "Codigo status" como estava no sistema anterior (ex.: virtual_card_pending_charge,
            not_virtual_card ou um código desconhecido). Só informativo: a classificação vale.
        originalPreviousClassification: { type: [string, 'null'] }
        firstVerifiedAt: { type: string, format: date-time, description: Primeira verificação no sistema anterior }
        lastVerifiedAt: { type: string, format: date-time, description: Última verificação no sistema anterior }
        verificationCount: { type: integer, minimum: 1, description: Verificações feitas pelo sistema anterior }
        merged:
          type: boolean
          description: >-
            true = o HUNIT Control já conhecia a reserva quando ela foi importada; a classificação e
            os dados são os dele, e só a primeira verificação e a contagem incluíram o sistema
            anterior (FR-010).

    TreatmentDocumentKind:
      type: string
      description: request = tratativa (pedido de cobrança); proof = comprovante de cobrança
      enum: [request, proof]

    TreatmentStatus:
      type: string
      description: >-
        none = sem tratativa; sent = Enviada (só tratativa); charged = Cobrada (com comprovante).
        Desde a 1.7.0 (feature 005), a tratativa inclui o envio ao Comercial pela planilha (não
        cancelado) e o comprovante inclui o retorno do Comercial confirmado pelo Financeiro.
      enum: [none, sent, charged]

    ReservationSituation:
      type: string
      description: >-
        Situação da reserva (feature 003, FR-002): proof_sent = Comprovante enviado (com
        comprovante, qualquer que seja a classificação); treatment_sent = Tratativa enviada (só
        tratativa e a classificação ainda exige cobrança); os demais valores são a classificação
        (status do Hunit).
      enum:
        - proof_sent
        - treatment_sent
        - ignored_hotelbeds_258
        - invoiced
        - charge_at_terminal
        - cancelled_no_charge
        - not_virtual_card
        - virtual_card_charge_error
        - virtual_card_already_charged
        - virtual_card_validated_only
        - virtual_card_pending_charge
        - analysis_error

    ReservationDetailedSituation:
      type: string
      description: >-
        Situação da reserva com o detalhe do Comercial (feature 005): os mesmos valores de
        ReservationSituation, mais return_pending = "Validar comprovante" (retorno do Comercial
        aguardando a validação do Financeiro; ainda conta em pendingCharge). Onde há
        return_pending, ReservationSituation continua treatment_sent (clientes até a 1.6.0).
      enum:
        - return_pending
        - proof_sent
        - treatment_sent
        - ignored_hotelbeds_258
        - invoiced
        - charge_at_terminal
        - cancelled_no_charge
        - not_virtual_card
        - virtual_card_charge_error
        - virtual_card_already_charged
        - virtual_card_validated_only
        - virtual_card_pending_charge
        - analysis_error

    ReservationQuickFilter:
      type: string
      description: >-
        Filtro rápido da lista (feature 006, FR-016): pending_charge = "Falta cobrar" (o mesmo de
        pendingCharge=true); to_review = "A verificar" (alerta "Verificar", "A revisar (sistema
        anterior)" ou "Validar comprovante"); with_error = "Com erro" (erro na cobrança ou de
        análise); done = "Concluídas" (comprovante enviado, faturada, já cobrada, cancelada sem
        cobrança ou ignorada). Uma reserva pode estar em mais de um.
      enum: [pending_charge, to_review, with_error, done]

    ReservationOrder:
      type: string
      description: >-
        Ordem da lista (feature 006): hotel_number = código do hotel e número da reserva (a ordem
        da 1.7.0); hotel_check_in = código do hotel, check-in crescente e número da reserva;
        amount_desc (feature 007) = valor total do maior para o menor (nas reservas em aberto, é o
        valor a cobrar), sem valor no fim, depois código do hotel e número da reserva.
      enum: [hotel_number, hotel_check_in, amount_desc]

    ReportAmount:
      type: string
      pattern: '^[0-9]+\.[0-9]{2}$'
      description: Soma em BRL (feature 007), nunca nula

    ReportOverview:
      type: object
      description: Resumo do período de check-in (feature 007). Sem dado de hóspede.
      required:
        - period
        - generatedAt
        - lastVerifiedAt
        - reservations
        - treatmentsSent
        - withoutAmount
        - hotels
        - open
        - charged
        - hotelRows
      properties:
        period:
          type: object
          required: [from, to]
          properties:
            from: { type: string, format: date }
            to: { type: string, format: date }
        generatedAt:
          type: string
          format: date-time
          description: Momento do cálculo
        lastVerifiedAt:
          type: [string, 'null']
          format: date-time
          description: Leitura mais recente no Hunit entre as reservas do relatório; nulo sem reservas
        reservations:
          type: integer
          minimum: 0
          description: Reservas do relatório (sem Ignorada, A revisar e Faturada)
        treatmentsSent:
          type: integer
          minimum: 0
          description: Reservas do relatório com tratativa (documento vigente ou linha enviada ao Comercial)
        withoutAmount:
          type: integer
          minimum: 0
          description: Reservas numa faixa de valor sem valor nenhum (ficam fora das somas)
        hotels:
          type: object
          required: [withData, total]
          properties:
            withData: { type: integer, minimum: 0, description: Hotéis com reservas do relatório no período }
            total: { type: integer, minimum: 0, description: Hotéis disponíveis mais os indisponíveis com dados no período }
        open:
          type: object
          description: Valor em aberto ("Falta cobrar")
          required: [amount, count, requested, pending]
          properties:
            amount: { $ref: '#/components/schemas/ReportAmount' }
            count: { type: integer, minimum: 0, description: Reservas em "Falta cobrar" }
            requested: { $ref: '#/components/schemas/ReportAmount' }
            pending: { $ref: '#/components/schemas/ReportAmount' }
        charged:
          type: object
          description: Valor já cobrado
          required: [amount, previous, recovered]
          properties:
            amount: { $ref: '#/components/schemas/ReportAmount' }
            previous: { $ref: '#/components/schemas/ReportAmount' }
            recovered: { $ref: '#/components/schemas/ReportAmount' }
        hotelRows:
          type: array
          description: Uma linha por hotel com reservas do relatório no período, em ordem de código
          items: { $ref: '#/components/schemas/HotelReportRow' }

    HotelReportRow:
      type: object
      required:
        - hotelCode
        - hotelName
        - reservations
        - treatmentsSent
        - openCount
        - openAmount
        - requested
        - pending
        - previousCharged
        - recovered
      properties:
        hotelCode: { type: string }
        hotelName: { type: string }
        reservations: { type: integer, minimum: 0 }
        treatmentsSent: { type: integer, minimum: 0 }
        openCount: { type: integer, minimum: 0 }
        openAmount: { $ref: '#/components/schemas/ReportAmount' }
        requested: { $ref: '#/components/schemas/ReportAmount' }
        pending: { $ref: '#/components/schemas/ReportAmount' }
        previousCharged: { $ref: '#/components/schemas/ReportAmount' }
        recovered: { $ref: '#/components/schemas/ReportAmount' }

    ReservationQuickFilterCounts:
      type: object
      description: >-
        Reservas de cada filtro rápido com os mesmos filtros (feature 006, FR-017); all = "Todas".
      required: [all, pendingCharge, toReview, withError, done]
      properties:
        all: { type: integer, minimum: 0 }
        pendingCharge: { type: integer, minimum: 0 }
        toReview: { type: integer, minimum: 0 }
        withError: { type: integer, minimum: 0 }
        done: { type: integer, minimum: 0 }

    TreatmentDocumentState:
      type: string
      description: >-
        current = documento atual; replaced = substituído; removed = desfeito; purged = arquivo
        apagado pelo prazo de retenção (o registro fica)
      enum: [current, replaced, removed, purged]

    ReservationKey:
      type: object
      required: [hotelCode, reservationNumber]
      additionalProperties: false
      properties:
        hotelCode: { type: string, minLength: 1 }
        reservationNumber: { type: string, minLength: 1 }

    TreatmentFile:
      type: object
      required: [fileId, sizeBytes, mediaType]
      properties:
        fileId:
          type: string
          pattern: '^[0-9a-f]{64}$'
          description: SHA-256 do conteúdo
        sizeBytes: { type: integer }
        mediaType: { type: string, description: Tipo decidido pelo servidor a partir do conteúdo }

    TreatmentDocument:
      type: object
      required: [id, kind, state, sizeBytes, mediaType, attachedAt, attachedBy]
      properties:
        id: { type: string, format: uuid }
        kind: { $ref: '#/components/schemas/TreatmentDocumentKind' }
        state: { $ref: '#/components/schemas/TreatmentDocumentState' }
        fileName: { type: [string, 'null'], description: null depois da purga }
        sizeBytes: { type: integer }
        mediaType: { type: string }
        attachedAt: { type: string, format: date-time }
        attachedBy: { type: string, description: Nome do cliente da API que anexou }
        endedAt: { type: [string, 'null'], format: date-time }
        endedBy: { type: [string, 'null'] }
        revertibleUntil:
          type: [string, 'null']
          format: date-time
          description: Preenchido só em documentos substituídos ou desfeitos ainda no prazo de 30 dias (FR-013a)
        fromLegacy:
          type: boolean
          description: >-
            true = importado do sistema anterior (feature 004, FR-016): attachedAt é a data original
            e attachedBy é "sistema-anterior". Ausente = false.

    ReservationTreatment:
      type: object
      description: Resumo da tratativa manual de uma reserva (feature 003)
      required:
        - status
        - situation
        - detailedSituation
        - needsReview
        - request
        - proof
        - manualChargedAmount
        - commercialChargedAmount
        - effectiveChargedAmount
        - chargedAmountOrigin
        - acceptsDocuments
        - noChargeHistory
      properties:
        status: { $ref: '#/components/schemas/TreatmentStatus' }
        situation: { $ref: '#/components/schemas/ReservationSituation' }
        detailedSituation: { $ref: '#/components/schemas/ReservationDetailedSituation' }
        commercialChargedAmount: { $ref: '#/components/schemas/Money' }
        chargedAmountOrigin:
          type: [string, 'null']
          description: >-
            De onde vem effectiveChargedAmount (feature 005, FR-024): hunit (o Hunit informa),
            manual (informado à mão, feature 003) ou commercial (retorno confirmado); null = sem
            valor cobrado.
          enum: [hunit, manual, commercial, null]
        needsReview:
          type: boolean
          description: >-
            Alerta "Verificar" (FR-002a): só tratativa, a classificação deixou de exigir cobrança e
            ninguém confirmou depois da última mudança de situação no Hunit
        request:
          oneOf:
            - $ref: '#/components/schemas/TreatmentDocument'
            - type: 'null'
        proof:
          oneOf:
            - $ref: '#/components/schemas/TreatmentDocument'
            - type: 'null'
        manualChargedAmount: { $ref: '#/components/schemas/Money' }
        effectiveChargedAmount: { $ref: '#/components/schemas/Money' }
        acceptsDocuments:
          type: boolean
          description: A classificação atual aceita registrar, substituir e reverter (FR-003)
        noChargeHistory:
          type: array
          description: >-
            Marcações "Cancelada sem cobrança" da reserva, da mais recente para a mais antiga, com
            quem marcou e quem desfez (feature 008), para o histórico do card "Tratativa"
          items: { $ref: '#/components/schemas/NoChargeMark' }

    TreatmentEvent:
      type: object
      required: [id, type, client, at]
      properties:
        id: { type: integer }
        type:
          type: string
          enum: [attached, replaced, removed, reverted, amount_set, amount_cleared, review_confirmed]
        kind:
          oneOf:
            - $ref: '#/components/schemas/TreatmentDocumentKind'
            - type: 'null'
        documentId: { type: [string, 'null'], format: uuid }
        previousDocumentId: { type: [string, 'null'], format: uuid }
        amount: { $ref: '#/components/schemas/Money' }
        classification:
          description: Só em review_confirmed — o status do Hunit que o operador confirmou (FR-002a)
          oneOf:
            - $ref: '#/components/schemas/Classification'
            - type: 'null'
        batchId: { type: [string, 'null'], format: uuid }
        client: { type: string, description: Nome do cliente da API que fez a ação }
        at: { type: string, format: date-time }
        fromLegacy:
          type: boolean
          description: >-
            true = importado do sistema anterior (feature 004, FR-016): at é a data original e
            client é "sistema-anterior". Ausente = false.

    ReservationOutcome:
      type: object
      required: [hotelCode, reservationNumber, outcome]
      properties:
        hotelCode: { type: string }
        reservationNumber: { type: string }
        outcome:
          type: string
          description: >-
            registered = documento novo; replaced = substituiu o atual; ignored = ficou de fora
            (ver reason); failed = erro inesperado, a reserva ficou como estava
          enum: [registered, replaced, ignored, failed]
        reason:
          type: [string, 'null']
          enum: [not_found, not_eligible, same_file, null]
        classification:
          oneOf:
            - $ref: '#/components/schemas/Classification'
            - type: 'null'
        totalAmount: { $ref: '#/components/schemas/Money' }
        documentId:
          type: [string, 'null']
          format: uuid
          description: Preenchido em registered e replaced (ausente na conferência)

    ClientRole:
      type: string
      enum: [operator, reader]

    ClientIdentity:
      type: object
      required: [name, role]
      properties:
        name:
          type: string
          description: Mesmo valor de Execution.requestedClient para as execuções iniciadas por este cliente
        role: { $ref: '#/components/schemas/ClientRole' }

    EvidenceSummary:
      type: object
      required: [id, kind, reason, files, createdAt, expiresAt]
      properties:
        id: { type: string, format: uuid }
        hotelCode: { type: [string, 'null'] }
        reservationNumber: { type: [string, 'null'] }
        kind:
          type: string
          enum: [navigation_failure, classification_failure, screen_not_recognized, reservation_status_unknown]
        reason: { type: string }
        files:
          type: array
          minItems: 1
          items: { type: string, enum: [screenshot, html, response] }
          description: Arquivos disponíveis para GET /evidence/{evidenceId}/{file}
        createdAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time }

    # ---------------------------------------------------------------------------------------
    # Feature 005 — envio ao Comercial pela planilha
    # ---------------------------------------------------------------------------------------

    CommercialLineState:
      type: string
      description: >-
        open = na aba "A cobrar"; concluded = na aba "Concluídas" (comprovante ou o Hunit não exige
        mais cobrança); cancelled = envio desfeito pelo Financeiro ("Pedido cancelado pelo
        Financeiro", também em "Concluídas")
      enum: [open, concluded, cancelled]

    CommercialReturnState:
      type: string
      description: >-
        awaiting_validation = lido da planilha, aguardando o Financeiro; confirmed = confirmado
        (vale como comprovante); rejected = recusado (ver rejectionReason); superseded = substituído
        por um retorno alterado pelo Comercial; closed = encerrado sem validação (comprovante por
        arquivo, ou o Hunit deixou de exigir cobrança: a reserva fica com o alerta "Verificar")
      enum: [awaiting_validation, confirmed, rejected, superseded, closed]

    CommercialSummary:
      type: object
      description: Resumo do envio ao Comercial de uma reserva (feature 005)
      required:
        [lineState, inSheet, lastSentAt, lastDispatchId, returnState, currentReturn, returnProblem, syncPending, report, situationReturn]
      properties:
        lineState: { $ref: '#/components/schemas/CommercialLineState' }
        inSheet:
          type: boolean
          description: false = a linha já saiu da planilha (90 dias depois de concluída, ou anonimização)
        lastSentAt: { type: string, format: date-time }
        lastDispatchId: { type: string, format: uuid }
        returnState:
          type: [string, 'null']
          description: Estado do retorno atual (o mais recente que não foi substituído); null = sem retorno
          enum: [awaiting_validation, confirmed, rejected, closed, null]
        currentReturn:
          description: >-
            O retorno atual (o mesmo de returnState), para a lista de revisão da confirmação em lote
            (FR-016a) e a lista de retornos a validar, sem uma consulta por reserva; null = sem retorno
            ou, desde a 1.12.0, quando o retorno atual tem uma situação livre (ver situationReturn)
          oneOf:
            - type: 'null'
            - $ref: '#/components/schemas/CommercialReturnBrief'
        returnProblem:
          type: [string, 'null']
          description: >-
            Problema do retorno preenchido na planilha, por exemplo "Retorno incompleto: falta o
            valor cobrado"
        syncPending:
          type: boolean
          description: A linha tem atualização da planilha ainda não aplicada (FR-013)
        report:
          description: >-
            Relato atual do Comercial ("Cobrada no Hunit" ou "Cancelada", feature 008); null = sem
            relato
          oneOf:
            - type: 'null'
            - $ref: '#/components/schemas/CommercialReportBrief'
        situationReturn:
          description: >-
            O retorno atual quando ele tem uma situação livre do Comercial (feature 009); então
            currentReturn é null e returnState traz o estado dele. null = sem retorno de situação
          oneOf:
            - type: 'null'
            - $ref: '#/components/schemas/CommercialSituationReturn'

    CommercialSituationReturn:
      type: object
      description: >-
        Retorno do Comercial com uma situação livre (feature 009): só a situação e o responsável
        são obrigatórios; código, hotel, valor e data aparecem se o Comercial preencheu
      required:
        - id
        - state
        - situationText
        - chargedBy
        - authorizationCode
        - chargeHotel
        - chargedAmount
        - chargeDate
        - readAt
        - decidedAt
        - decidedBy
        - rejectionReason
        - decision
      properties:
        id: { type: string, format: uuid }
        state:
          type: string
          description: >-
            awaiting_validation = aguardando o Financeiro; confirmed = confirmado como cobrado
            (vale como comprovante); rejected = recusado (ver rejectionReason); closed = encerrado
            (confirmado como cancelado sem cobrança, ou o Hunit deixou de exigir cobrança)
          enum: [awaiting_validation, confirmed, rejected, closed]
        situationText: { type: string, maxLength: 100, description: A situação como o Comercial escreveu }
        chargedBy: { type: string, description: Responsável pela cobrança no Comercial }
        authorizationCode: { type: [string, 'null'] }
        chargeHotel: { type: [string, 'null'] }
        chargedAmount:
          description: Valor cobrado informado pelo Comercial; null = não informado
          $ref: '#/components/schemas/Money'
        chargeDate: { type: [string, 'null'], format: date }
        readAt: { type: string, format: date-time }
        decidedAt: { type: [string, 'null'], format: date-time }
        decidedBy: { type: [string, 'null'], description: Cliente da API que decidiu }
        rejectionReason: { type: [string, 'null'] }
        decision:
          type: [string, 'null']
          description: >-
            charged = confirmado como cobrado; no_charge = confirmado como cancelado sem cobrança;
            null = não decidido, recusado ou encerrado sem decisão
          enum: [charged, no_charge, null]

    CommercialReturnBrief:
      type: object
      description: Resumo do retorno atual de uma reserva (feature 005), na lista de reservas
      required:
        [id, state, authorizationCode, chargeHotel, chargedAmount, chargedBy, readAt, difference, chargeSituation, chargeDate]
      properties:
        id: { type: string, format: uuid }
        state: { $ref: '#/components/schemas/CommercialReturnState' }
        authorizationCode: { type: string }
        chargeHotel:
          type: string
          description: Estabelecimento que aparece na maquininha, como o Comercial escreveu (texto livre)
        chargedAmount: { $ref: '#/components/schemas/Money' }
        chargedBy: { type: string }
        readAt: { type: string, format: date-time }
        difference:
          description: Valor cobrado menos o valor total da reserva (o valor a cobrar)
          $ref: '#/components/schemas/Money'
        chargeSituation:
          description: Situação da cobrança informada pelo Comercial (feature 008); null = não informada
          oneOf:
            - type: 'null'
            - $ref: '#/components/schemas/ChargeSituation'
        chargeDate:
          type: [string, 'null']
          format: date
          description: Data da cobrança informada pelo Comercial (feature 008); null = não informada

    CommercialLine:
      type: object
      description: Linha da reserva na planilha do Comercial (feature 005)
      required:
        - state
        - inSheet
        - tab
        - firstSentAt
        - lastSentAt
        - lastDispatchId
        - lastSentBy
        - concludedAt
        - cancelledAt
        - cancelledBy
        - restorableUntil
        - returnProblem
        - sheetIssue
        - syncPending
        - sheetTab
      properties:
        state: { $ref: '#/components/schemas/CommercialLineState' }
        inSheet: { type: boolean }
        tab:
          type: [string, 'null']
          description: >-
            to_charge = "A cobrar"; done = "Concluídas"; null = fora da planilha. A aba "Aguardando
            validação do Financeiro" (feature 009) aparece aqui como to_charge; ver sheetTab
          enum: [to_charge, done, null]
        sheetTab:
          type: [string, 'null']
          description: >-
            Aba da linha na planilha (feature 009): to_charge = "A cobrar"; awaiting_validation =
            "Aguardando validação do Financeiro"; done = "Concluídas"; null = fora da planilha
          enum: [to_charge, awaiting_validation, done, null]
        firstSentAt: { type: string, format: date-time }
        lastSentAt: { type: string, format: date-time }
        lastDispatchId: { type: string, format: uuid }
        lastSentBy: { type: string, description: Nome do cliente da API que fez o último envio }
        concludedAt: { type: [string, 'null'], format: date-time }
        cancelledAt: { type: [string, 'null'], format: date-time }
        cancelledBy: { type: [string, 'null'] }
        restorableUntil:
          type: [string, 'null']
          format: date-time
          description: Preenchido só em linha cancelada que ainda pode ser revertida (30 dias)
        returnProblem: { type: [string, 'null'] }
        sheetIssue:
          type: [string, 'null']
          description: Último caso relatado na linha, por exemplo uma célula do sistema restaurada
        syncPending: { type: boolean }

    CommercialReturn:
      type: object
      description: Retorno preenchido pelo Comercial na planilha (feature 005)
      required:
        - id
        - authorizationCode
        - chargeHotel
        - chargedAmount
        - chargedBy
        - readAt
        - state
        - decidedAt
        - decidedBy
        - rejectionReason
        - expectedAmount
        - difference
        - chargeSituation
        - chargeDate
      properties:
        id: { type: string, format: uuid }
        authorizationCode: { type: string }
        chargeHotel:
          type: string
          description: Estabelecimento que aparece na maquininha, como o Comercial escreveu (texto livre)
        chargedAmount: { $ref: '#/components/schemas/Money' }
        chargedBy: { type: string, description: Responsável pela cobrança no Comercial }
        readAt: { type: string, format: date-time }
        state: { $ref: '#/components/schemas/CommercialReturnState' }
        decidedAt: { type: [string, 'null'], format: date-time }
        decidedBy: { type: [string, 'null'], description: Cliente da API que confirmou ou recusou }
        rejectionReason: { type: [string, 'null'] }
        expectedAmount:
          $ref: '#/components/schemas/Money'
        difference:
          $ref: '#/components/schemas/Money'
        chargeSituation:
          description: Situação da cobrança informada pelo Comercial (feature 008); null = não informada
          oneOf:
            - type: 'null'
            - $ref: '#/components/schemas/ChargeSituation'
        chargeDate:
          type: [string, 'null']
          format: date
          description: Data da cobrança informada pelo Comercial (feature 008); null = não informada

    CommercialEvent:
      type: object
      description: Item do histórico do Comercial de uma reserva (feature 005, FR-020)
      required: [id, type, actor, at, dispatchId, returnId, classification, reason, batchId]
      properties:
        id: { type: integer }
        type:
          type: string
          enum:
            - dispatched
            - withdrawn
            - line_cancelled
            - line_restored
            - line_concluded
            - return_received
            - return_changed
            - return_ignored
            - return_confirmed
            - return_rejected
            - return_confirmation_undone
            - return_closed
        actor:
          type: object
          required: [kind, name]
          properties:
            kind:
              type: string
              description: >-
                client = um cliente da API; commercial_sheet = o Comercial, pela planilha; system = o
                próprio HUNIT Control (ex.: linha concluída porque uma execução mostrou a reserva
                como cobrada)
              enum: [client, commercial_sheet, system]
            name: { type: string }
        at: { type: string, format: date-time }
        dispatchId: { type: [string, 'null'], format: uuid }
        returnId: { type: [string, 'null'], format: uuid }
        classification:
          oneOf:
            - $ref: '#/components/schemas/Classification'
            - type: 'null'
        reason: { type: [string, 'null'] }
        batchId: { type: [string, 'null'], format: uuid }

    CommercialDetail:
      type: object
      required: [line, returns, events, report, history, situationReturns]
      properties:
        line:
          oneOf:
            - type: 'null'
            - $ref: '#/components/schemas/CommercialLine'
        returns:
          type: array
          description: Retornos do Comercial, sem os de situação livre (ver situationReturns)
          items: { $ref: '#/components/schemas/CommercialReturn' }
        situationReturns:
          type: array
          description: >-
            Retornos com situação livre do Comercial (feature 009), do mais recente para o mais
            antigo
          items: { $ref: '#/components/schemas/CommercialSituationReturn' }
        events:
          type: array
          description: Histórico com os tipos da 1.7.0 (os eventos novos da 008 ficam só em history)
          items: { $ref: '#/components/schemas/CommercialEvent' }
        report:
          description: Relato atual do Comercial (feature 008); null = sem relato
          oneOf:
            - type: 'null'
            - $ref: '#/components/schemas/CommercialReportBrief'
        history:
          type: array
          description: >-
            Histórico completo do Comercial, com os tipos novos da feature 008 (relatos e verificação
            no Hunit), do mais recente para o mais antigo
          items: { $ref: '#/components/schemas/CommercialHistoryEvent' }

    CommercialDispatchCheck:
      type: object
      required: [eligible, ignored, totalAmount]
      properties:
        eligible:
          type: array
          items:
            type: object
            required: [hotelCode, reservationNumber, totalAmount, resend]
            properties:
              hotelCode: { type: string }
              reservationNumber: { type: string }
              totalAmount: { $ref: '#/components/schemas/Money' }
              resend: { type: boolean, description: A reserva já está na planilha; o envio atualiza a linha }
        ignored:
          type: array
          items: { $ref: '#/components/schemas/CommercialDispatchIgnored' }
        totalAmount:
          type: string
          pattern: '^[0-9]+\.[0-9]{2}$'
          description: Soma do valor total das reservas aceitas, em BRL

    CommercialDispatchIgnored:
      type: object
      required: [hotelCode, reservationNumber, reason]
      properties:
        hotelCode: { type: string }
        reservationNumber: { type: string }
        reason:
          type: string
          description: >-
            not_found = reserva não encontrada; not_accepting = a situação não aceita tratativa;
            has_proof = já tem comprovante; return_awaiting_validation = há retorno do Comercial
            aguardando validação
          enum: [not_found, not_accepting, has_proof, return_awaiting_validation]

    CommercialDispatchCounts:
      type: object
      required: [total, pending, sent, withdrawn, notVerified, ignored, checked]
      properties:
        total: { type: integer }
        pending: { type: integer }
        sent: { type: integer }
        withdrawn: { type: integer }
        notVerified: { type: integer }
        ignored: { type: integer }
        checked:
          type: integer
          description: Conferidas no Hunit (só em verificações, purpose = hunit_check; feature 008)

    CommercialDispatchSummary:
      type: object
      required:
        [id, requestedClient, parentDispatchId, status, endReason, createdAt, finishedAt, counts, purpose]
      properties:
        id: { type: string, format: uuid }
        requestedClient: { type: string, description: Cliente da API que fez o envio }
        parentDispatchId: { type: [string, 'null'], format: uuid }
        status: { $ref: '#/components/schemas/ExecutionStatus' }
        endReason:
          oneOf:
            - $ref: '#/components/schemas/ExecutionEndReason'
            - type: 'null'
        createdAt: { type: string, format: date-time }
        finishedAt: { type: [string, 'null'], format: date-time }
        counts: { $ref: '#/components/schemas/CommercialDispatchCounts' }
        purpose: { $ref: '#/components/schemas/CommercialDispatchPurpose' }

    CommercialDispatchItem:
      type: object
      required:
        [hotelCode, reservationNumber, position, outcome, classificationBefore, classificationAfter, reason, processedAt, checkResult]
      properties:
        hotelCode: { type: string }
        reservationNumber: { type: string }
        position: { type: integer, minimum: 1 }
        outcome:
          type: string
          description: >-
            pending = ainda não verificada; sent = enviada; withdrawn = retirada (o Hunit não exige
            mais cobrança; reason = a classificação); not_verified = não verificada (reason diz por
            quê); ignored = não aceitou o envio (reason = o código de elegibilidade); checked =
            conferida no Hunit (só em verificações, purpose = hunit_check; ver checkResult)
          enum: [pending, sent, withdrawn, not_verified, ignored, checked]
        checkResult:
          type: [string, 'null']
          description: >-
            Só em verificações (feature 008): confirmed = o Hunit mostra a cobrança; not_found = o
            Hunit não mostra a cobrança; null = não conferida
          enum: [confirmed, not_found, null]
        classificationBefore:
          oneOf:
            - $ref: '#/components/schemas/Classification'
            - type: 'null'
        classificationAfter:
          oneOf:
            - $ref: '#/components/schemas/Classification'
            - type: 'null'
        reason: { type: [string, 'null'] }
        processedAt: { type: [string, 'null'], format: date-time }

    CommercialDispatch:
      type: object
      required:
        - id
        - requestedClient
        - parentDispatchId
        - resumedByDispatchId
        - status
        - endReason
        - endMessage
        - createdAt
        - startedAt
        - finishedAt
        - twoFactorDeadline
        - counts
        - current
        - items
        - lastEventId
        - purpose
      properties:
        id: { type: string, format: uuid }
        requestedClient: { type: string }
        parentDispatchId: { type: [string, 'null'], format: uuid }
        resumedByDispatchId: { type: [string, 'null'], format: uuid }
        status: { $ref: '#/components/schemas/ExecutionStatus' }
        endReason:
          oneOf:
            - $ref: '#/components/schemas/ExecutionEndReason'
            - type: 'null'
        endMessage:
          type: [string, 'null']
          description: Mensagem do último status_changed, por exemplo o motivo da falha
        createdAt: { type: string, format: date-time }
        startedAt: { type: [string, 'null'], format: date-time }
        finishedAt: { type: [string, 'null'], format: date-time }
        twoFactorDeadline: { type: [string, 'null'], format: date-time }
        counts: { $ref: '#/components/schemas/CommercialDispatchCounts' }
        purpose: { $ref: '#/components/schemas/CommercialDispatchPurpose' }
        current:
          description: Reserva em verificação agora; null fora do andamento
          oneOf:
            - type: 'null'
            - $ref: '#/components/schemas/ReservationKey'
        items:
          type: array
          maxItems: 2000
          items: { $ref: '#/components/schemas/CommercialDispatchItem' }
        lastEventId:
          type: [string, 'null']
          description: >-
            Id do evento mais recente do envio; null = nenhum. O acompanhamento abre o fluxo de
            eventos a partir dele (Last-Event-ID), sem reprocessar o histórico

    CommercialDispatchEvent:
      type: object
      required: [id, at, type, message]
      properties:
        id: { type: string }
        at: { type: string, format: date-time }
        type:
          type: string
          enum: [status_changed, item_processed, warning]
        status: { $ref: '#/components/schemas/ExecutionStatus' }
        hotelCode: { type: [string, 'null'] }
        reservationNumber: { type: [string, 'null'] }
        message: { type: string }

    ConfirmationBatchResult:
      type: object
      description: Resultado de uma confirmação em lote (retornos do Comercial ou alerta "Verificar")
      required: [batchId, items, countsByClassification]
      properties:
        batchId: { type: string, format: uuid }
        items:
          type: array
          items:
            type: object
            required: [hotelCode, reservationNumber, outcome, reason]
            properties:
              hotelCode: { type: string }
              reservationNumber: { type: string }
              outcome:
                type: string
                description: confirmed = confirmada; ignored = ficou de fora (ver reason); failed = erro inesperado, nada mudou
                enum: [confirmed, ignored, failed]
              reason:
                type: [string, 'null']
                description: >-
                  cancellation_not_accepted (feature 008, só com includeCancellations) = a reserva
                  não aceita a marcação "Cancelada sem cobrança" (ex.: já tem comprovante)
                enum:
                  [
                    not_found,
                    no_return_awaiting_validation,
                    no_review_alert,
                    cancellation_not_accepted,
                    null,
                  ]
        countsByClassification:
          $ref: '#/components/schemas/ClassificationCounts'

    SelectionItem:
      type: object
      description: Reserva da seleção e da cópia para e-mail (feature 005, FR-027, FR-030)
      required:
        - hotelCode
        - hotelName
        - reservationNumber
        - guestName
        - channel
        - checkIn
        - totalAmount
        - reservationStatus
        - classification
        - treatmentStatus
        - situation
        - detailedSituation
        - needsReview
        - effectiveChargedAmount
        - chargedAmountOrigin
        - currentReturn
      properties:
        hotelCode: { type: string }
        hotelName: { type: string }
        reservationNumber: { type: string }
        guestName:
          type: [string, 'null']
          description: Só para a lista da seleção no app; a cópia para e-mail nunca o usa. null após anonimização
        channel: { type: [string, 'null'] }
        checkIn: { type: [string, 'null'], format: date }
        totalAmount: { $ref: '#/components/schemas/Money' }
        reservationStatus: { $ref: '#/components/schemas/ReservationStatus' }
        classification: { $ref: '#/components/schemas/Classification' }
        treatmentStatus: { $ref: '#/components/schemas/TreatmentStatus' }
        situation: { $ref: '#/components/schemas/ReservationSituation' }
        detailedSituation: { $ref: '#/components/schemas/ReservationDetailedSituation' }
        needsReview: { type: boolean }
        effectiveChargedAmount: { $ref: '#/components/schemas/Money' }
        chargedAmountOrigin:
          type: [string, 'null']
          enum: [hunit, manual, commercial, null]
        currentReturn:
          description: O retorno atual do Comercial (lista de revisão da confirmação em lote, FR-016a); null = sem retorno
          oneOf:
            - type: 'null'
            - $ref: '#/components/schemas/CommercialReturnBrief'

    ReservationSelection:
      type: object
      required: [total, truncated, items]
      properties:
        total: { type: integer, description: Quantas reservas o filtro encontrou }
        truncated: { type: boolean, description: true = total maior que 2 000; vieram as 2 000 primeiras }
        items:
          type: array
          maxItems: 2000
          items: { $ref: '#/components/schemas/SelectionItem' }

    CommercialSheetProblem:
      type: object
      required: [hotelCode, reservationNumber, kind, message, at]
      properties:
        hotelCode: { type: [string, 'null'], description: null quando a linha não tem um hotel do catálogo }
        reservationNumber: { type: [string, 'null'] }
        kind:
          type: string
          description: >-
            incomplete = retorno com coluna faltando; illegible = valor não entendido; orphan_line =
            linha sem envio correspondente; duplicate_line = linha repetida (apagada); restored_line =
            linha ou célula do sistema restaurada
          enum: [incomplete, illegible, orphan_line, duplicate_line, restored_line]
        message: { type: string, description: Em português e sem dado pessoal do hóspede }
        at: { type: string, format: date-time }

    CommercialSheetStatus:
      type: object
      description: Estado da integração com a planilha do Comercial (feature 005, FR-013); nunca traz o identificador da planilha nem a chave
      required:
        - configured
        - status
        - lastRoundOkAt
        - lastReadOkAt
        - lastError
        - nextAttemptAt
        - pending
        - awaitingValidation
        - problems
        - reports
        - hunitQueueCount
      properties:
        configured: { type: boolean }
        status:
          type: string
          description: >-
            ok = última rodada concluída; failing = a última rodada falhou (ver lastError);
            layout_invalid = o formato da planilha foi alterado (rode o comando de preparação);
            not_configured = integração desligada no servidor
          enum: [ok, failing, layout_invalid, not_configured]
        lastRoundOkAt: { type: [string, 'null'], format: date-time }
        lastReadOkAt: { type: [string, 'null'], format: date-time }
        lastError:
          oneOf:
            - type: 'null'
            - type: object
              required: [code, message, at]
              properties:
                code:
                  type: string
                  enum: [sheet_unavailable, sheet_forbidden, sheet_not_found, sheet_layout_invalid, sheet_rate_limited]
                message: { type: string, description: Mensagem genérica em português }
                at: { type: string, format: date-time }
        nextAttemptAt: { type: [string, 'null'], format: date-time }
        pending:
          type: object
          required: [count, oldestChangeAt]
          properties:
            count: { type: integer, description: Linhas com atualização ainda não aplicada na planilha }
            oldestChangeAt: { type: [string, 'null'], format: date-time }
        awaitingValidation:
          type: integer
          description: >-
            Retornos aguardando a validação do Financeiro; desde a 008, com as "Cancelada" aguardando
            validação (os itens de `reports`); desde a 009, com os retornos de situação livre
        problems:
          type: array
          items: { $ref: '#/components/schemas/CommercialSheetProblem' }
        reports:
          type: array
          description: >-
            "Cancelada" do Comercial aguardando a validação do Financeiro (feature 008), para
            "Retornos a validar": só com a linha em "A cobrar" e a reserva sem a marcação
            "Cancelada sem cobrança" (até a homologação, relatos "Não cobrada" para "Retornos com
            problema")
          items: { $ref: '#/components/schemas/CommercialReportProblem' }
        hunitQueueCount:
          type: integer
          minimum: 0
          description: Reservas na fila "Cobradas no Hunit" (feature 008), a contagem da aba

    CommercialSheetRead:
      type: object
      required: [sheet, round]
      properties:
        sheet: { $ref: '#/components/schemas/CommercialSheetStatus' }
        round:
          type: object
          required: [returnsReceived, returnsChanged, problems, linesWritten]
          properties:
            returnsReceived: { type: integer, description: Retornos novos lidos nesta rodada }
            returnsChanged: { type: integer, description: Retornos alterados pelo Comercial nesta rodada }
            problems: { type: integer, description: Retornos com problema encontrados nesta rodada }
            linesWritten: { type: integer, description: Linhas escritas ou movidas nesta rodada }

    ChargeSituation:
      type: object
      description: Situação da cobrança informada pelo Comercial na planilha (feature 008)
      required: [kind, text]
      properties:
        kind:
          type: string
          description: >-
            charged_at_terminal = "Cobrada na maquininha"; charged_in_hunit = "Cobrada no Hunit";
            cancelled = "Cancelada" (texto que começa com "cancelad"; era not_charged, "Não
            cobrada", até a homologação); other = outro texto, mostrado como veio
          enum: [charged_at_terminal, charged_in_hunit, cancelled, other]
        text: { type: string, maxLength: 100, description: Como o Comercial escreveu }

    NoChargeRequest:
      type: object
      required: [expectedSituation]
      additionalProperties: false
      properties:
        expectedSituation:
          $ref: '#/components/schemas/ReservationDetailedSituation'
        note:
          type: string
          minLength: 1
          maxLength: 500
          description: Observação opcional (apagada na anonimização da reserva)

    NoChargeMark:
      type: object
      description: Marcação "Cancelada sem cobrança" feita pelo Financeiro (feature 008)
      required: [id, markedAt, markedBy, note, previousAmount, undoneAt, undoneBy]
      properties:
        id: { type: string, format: uuid }
        markedAt: { type: string, format: date-time }
        markedBy: { type: string, description: Nome do cliente da API que marcou }
        note: { type: [string, 'null'] }
        previousAmount:
          description: Valor a cobrar no momento da marcação ("antes R$ …")
          $ref: '#/components/schemas/Money'
        undoneAt: { type: [string, 'null'], format: date-time }
        undoneBy: { type: [string, 'null'], description: Nome do cliente da API que desfez }

    ReservationNoCharge:
      description: A marcação ativa da reserva (feature 008)
      allOf:
        - $ref: '#/components/schemas/NoChargeMark'
        - type: object
          required: [hunitShowsCharge]
          properties:
            hunitShowsCharge:
              type: boolean
              description: O Hunit mostra a reserva como cobrada (FR-023); a marcação continua

    CommercialReportBrief:
      type: object
      description: Relato atual do Comercial na planilha, sem retorno de cobrança (feature 008)
      required: [kind, situationText, chargedBy, chargeDate, readAt, hunitStatus, validation]
      properties:
        kind:
          type: string
          description: >-
            charged_in_hunit = "Cobrada no Hunit"; cancelled = "Cancelada" (validada pelo
            Financeiro; era not_charged até a homologação)
          enum: [charged_in_hunit, cancelled]
        situationText: { type: string, description: A situação como o Comercial escreveu }
        chargedBy:
          type: [string, 'null']
          description: Responsável no Comercial; null só na "Cancelada" sem o responsável
        validation:
          description: Só na "Cancelada"; null em "Cobrada no Hunit" (homologação)
          oneOf:
            - type: 'null'
            - $ref: '#/components/schemas/CancellationValidation'
        chargeDate: { type: [string, 'null'], format: date }
        readAt: { type: string, format: date-time, description: Quando o servidor leu esta versão do relato }
        hunitStatus:
          type: [string, 'null']
          description: >-
            Só em charged_in_hunit; null em cancelled. awaiting = não lida no Hunit depois do
            relato; confirmed = o Hunit mostra a cobrança; not_found = lida depois do relato e o
            Hunit não mostra a cobrança
          enum: [awaiting, confirmed, not_found, null]

    HunitChargeStatus:
      type: string
      description: >-
        Situação na fila "Cobradas no Hunit" (feature 008): awaiting = "Aguardando verificação";
        confirmed = "Confirmada no Hunit"; not_found = "Não encontrada no Hunit"
      enum: [awaiting, confirmed, not_found]

    HunitChargeItem:
      type: object
      description: Linha da fila "Cobradas no Hunit" (feature 008)
      required:
        - hotelCode
        - hotelName
        - reservationNumber
        - guestName
        - channel
        - amountToCharge
        - situationText
        - chargedBy
        - chargeDate
        - readAt
        - status
        - checkedAt
        - classification
        - requiresCharge
      properties:
        hotelCode: { type: string }
        hotelName: { type: string }
        reservationNumber: { type: string }
        guestName: { type: [string, 'null'], description: null após anonimização }
        channel: { type: [string, 'null'] }
        amountToCharge: { $ref: '#/components/schemas/Money' }
        situationText: { type: string }
        chargedBy: { type: string }
        chargeDate: { type: [string, 'null'], format: date }
        readAt: { type: string, format: date-time }
        status: { $ref: '#/components/schemas/HunitChargeStatus' }
        checkedAt:
          type: [string, 'null']
          format: date-time
          description: Última leitura da reserva no Hunit depois do relato; null = ainda não lida
        classification:
          description: Classificação do Hunit (não a efetiva da marcação)
          $ref: '#/components/schemas/Classification'
        requiresCharge:
          type: boolean
          description: A reserva ainda exige cobrança (classificação efetiva, sem comprovante)

    HunitChargeQueue:
      type: object
      required: [items, counts]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/HunitChargeItem' }
        counts:
          type: object
          required: [awaiting, notFound, confirmed]
          properties:
            awaiting: { type: integer, minimum: 0 }
            notFound: { type: integer, minimum: 0 }
            confirmed: { type: integer, minimum: 0 }

    CancellationValidation:
      type: object
      description: Validação da "Cancelada" pelo Financeiro (feature 008, homologação)
      required: [state, decidedAt, decidedBy, rejectionReason]
      properties:
        state:
          type: string
          description: >-
            awaiting_validation = aguardando; confirmed = confirmada (a reserva foi marcada como
            "Cancelada sem cobrança"); rejected = recusada com o motivo
          enum: [awaiting_validation, confirmed, rejected]
        decidedAt: { type: [string, 'null'], format: date-time }
        decidedBy: { type: [string, 'null'], description: Nome do cliente da API que decidiu }
        rejectionReason: { type: [string, 'null'] }

    CommercialReportProblem:
      type: object
      description: >-
        "Cancelada" do Comercial aguardando a validação do Financeiro, para "Retornos a validar"
        (feature 008; até a homologação era o relato "Não cobrada", em "Retornos com problema")
      required: [hotelCode, reservationNumber, situationText, chargedBy, chargeDate, readAt, totalAmount]
      properties:
        hotelCode: { type: string }
        reservationNumber: { type: string }
        situationText: { type: string }
        chargedBy: { type: [string, 'null'] }
        chargeDate: { type: [string, 'null'], format: date }
        readAt: { type: string, format: date-time }
        totalAmount:
          description: Valor a cobrar da reserva hoje (vira R$ 0,00 ao confirmar)
          $ref: '#/components/schemas/Money'

    CommercialHistoryEvent:
      type: object
      description: >-
        Item do histórico do Comercial com os tipos novos da feature 008: report_received (o
        Comercial informou "Cobrada no Hunit" ou "Cancelada"; reason = a situação),
        report_changed (mudou o responsável, a data ou o texto), report_cleared (trocou a situação ou
        apagou) e hunit_checked (verificação no Hunit; classification = a lida; reason = "cobrança
        encontrada" ou "cobrança não encontrada"); da homologação, cancellation_confirmed e
        cancellation_rejected (o Financeiro confirmou ou recusou a "Cancelada"; reason = o motivo da
        recusa). Desde a 1.12.0 (feature 009), cancellation_confirmed com returnId é a confirmação
        de um retorno de situação livre como cancelado sem cobrança (reason = a situação do
        Comercial); sem returnId, é a "Cancelada" da 008
      required: [id, type, actor, at, dispatchId, returnId, classification, reason, batchId]
      properties:
        id: { type: integer }
        type:
          type: string
          enum:
            - dispatched
            - withdrawn
            - line_cancelled
            - line_restored
            - line_concluded
            - return_received
            - return_changed
            - return_ignored
            - return_confirmed
            - return_rejected
            - return_confirmation_undone
            - return_closed
            - report_received
            - report_changed
            - report_cleared
            - hunit_checked
            - cancellation_confirmed
            - cancellation_rejected
        actor:
          type: object
          required: [kind, name]
          properties:
            kind:
              type: string
              enum: [client, commercial_sheet, system]
            name: { type: string }
        at: { type: string, format: date-time }
        dispatchId: { type: [string, 'null'], format: uuid }
        returnId: { type: [string, 'null'], format: uuid }
        classification:
          oneOf:
            - $ref: '#/components/schemas/Classification'
            - type: 'null'
        reason: { type: [string, 'null'] }
        batchId: { type: [string, 'null'], format: uuid }

    CommercialDispatchPurpose:
      type: string
      description: >-
        send = envio ao Comercial (feature 005); hunit_check = verificação da fila "Cobradas no
        Hunit" (feature 008): lê as reservas no Hunit sem escrever linha nova na planilha
      enum: [send, hunit_check]
