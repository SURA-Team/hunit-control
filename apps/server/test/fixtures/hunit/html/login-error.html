<!DOCTYPE html>
<!-- RECONSTRUÍDA a partir da análise dos HARs de login (research R-13), sem dados reais. Substituir pelo HTML real anonimizado (tasks.md, T020/T021). -->
<!-- A marcação da mensagem de erro é a padrão do Keycloak e ainda não foi confirmada no Hunit. -->
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <title>Entrar em hsystem</title>
  </head>
  <body>
    <h1 id="kc-page-title">Entrar na sua conta</h1>
    <form id="kc-form-login" action="{{action}}" method="post">
      <label for="username">Endereço de e-mail</label>
      <input id="username" name="username" type="text" value="{{username}}" aria-invalid="true" />
      <label for="password">Senha</label>
      <input id="password" name="password" type="password" aria-invalid="true" />
      <span id="input-error" class="kc-feedback-text" aria-live="polite">E-mail ou senha inválidos.</span>
      <input id="kc-login" name="login" type="submit" value="Entrar" />
    </form>
  </body>
</html>
