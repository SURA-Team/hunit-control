<!DOCTYPE html>
<!-- RECONSTRUÍDA a partir da análise dos HARs de login (research R-13), sem dados reais. Substituir pelo HTML real anonimizado (tasks.md, T020/T021). -->
<!-- Marcação e texto da mensagem de erro conferidos com a tela real em 2026-11-11. -->
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <title>Entrar em hsystem</title>
  </head>
  <body>
    <h1 id="kc-page-title">Entrar na sua conta</h1>
    <div id="kc-username"><label id="kc-attempted-username">{{username}}</label></div>
    <form id="kc-otp-login-form" action="{{action}}" method="post">
      <label for="otp">Código do Autenticador</label>
      <input id="otp" name="otp" type="text" autocomplete="off" aria-invalid="true" />
      <span id="input-error-otp-code" class="pf-c-form__helper-text pf-m-error required kc-feedback-text" aria-live="polite">Código de uso único inválido.</span>
      <input id="kc-login" name="login" type="submit" value="Entrar" />
    </form>
  </body>
</html>
