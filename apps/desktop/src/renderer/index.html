<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <!--
      Política de conteúdo (specs/002, research R-02): a interface não faz requisição de rede
      (connect-src 'none'); tudo passa pela ponte window.hunit. Estilos inline liberados porque o
      Mantine injeta variáveis CSS; scripts continuam travados. Pré-visualização de documentos
      (specs/003, research R-08): imagens por URL blob: (bytes vindos do processo principal) e o
      worker do pdf.js, que é um arquivo do próprio app.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self'; font-src 'self'; worker-src 'self'; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Ícone da página: a marca da nova identidade (specs/006, FR-003, research R-04). -->
    <link rel="icon" type="image/svg+xml" href="../../resources/brand.svg" />
    <title>HUNIT Control</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./src/main.tsx"></script>
  </body>
</html>
